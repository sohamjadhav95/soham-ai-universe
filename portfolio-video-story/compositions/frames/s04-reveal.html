<!doctype html>
<!--
  s04 Reveal (L06). "Then Soham Jadhav measured every pixel. Exactly." Light snaps back. The same grid and
  lesion as s02: from "measured" a sweep replaces the binary blocks with each pixel's exact covered fraction
  (Sutherland–Hodgman clipping, values printed). On "Exactly." Pix is rescued: blocky → smooth, happy, hop.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("vendor/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Inter"; src: url("vendor/fonts/Inter-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Instrument Serif"; src: url("vendor/fonts/InstrumentSerif-400.woff2") format("woff2"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "Instrument Serif"; src: url("vendor/fonts/InstrumentSerif-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
        @font-face { font-family: "Archivo Black"; src: url("vendor/fonts/ArchivoBlack-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "JetBrains Mono"; src: url("vendor/fonts/JetBrainsMono-400.woff2") format("woff2"); font-weight: 400; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #s04-io { position: absolute; inset: 0; }
        #s04-cap { top: 140px; }
        #s04-card { position: absolute; left: 250px; top: 280px; width: 800px; height: 580px; border-radius: 30px;
          background: rgba(255,255,255,0.92); border: 1px solid rgba(20,21,24,0.08);
          box-shadow: 0 60px 100px -40px rgba(20,21,24,0.26), 0 14px 30px -16px rgba(20,21,24,0.14); }
        #s04-state { position: absolute; left: 40px; top: 30px; font-family: "JetBrains Mono"; font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; }
        #s04-grid { position: absolute; left: 40px; top: 84px; }
        #s04-pixbox { position: absolute; left: 1330px; top: 300px; width: 220px; height: 220px; }
        #s04-pix { position: absolute; inset: 0; }
        #s04-blocky { position: absolute; left: 0; top: 0; }
        .s04-spark { position: absolute; width: 34px; height: 34px; background: #ff5a1f;
          clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
        #s04-exact { position: absolute; left: 1140px; top: 590px; width: 600px; text-align: center; font-family: "Instrument Serif"; font-style: italic;
          font-size: 190px; line-height: 1; color: #e2470f; white-space: nowrap; }
        #s04-flash { position: absolute; inset: 0; background: #ffffff; }
      </style>

      <div id="root" data-composition-id="s04-reveal" data-width="1920" data-height="1080" data-duration="3.6333">
        <div id="s04-stage" class="clip" data-start="0" data-duration="3.6333" data-track-index="0">
          <div id="s04-io">
            <div id="s04-cap" class="cap"></div>
            <div id="s04-card">
              <div id="s04-state">Binary mask · whole pixels only</div>
              <canvas id="s04-grid" width="720" height="462"></canvas>
            </div>
            <div id="s04-pixbox"><div id="s04-pix"></div><canvas id="s04-blocky" width="220" height="220"></canvas>
              <div id="s04-sparks" data-layout-ignore></div></div>
            <div id="s04-exact">Exactly.</div>
          </div>
          <div id="s04-flash" data-layout-ignore></div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit, E = K.ease, Q = K.cue("s04-reveal"), D = Q.dur;
          var COLS = 16, ROWS = 10, CELL = 44, GX = 8, GY = 8;
          var poly = K.lesion(8.0, 5.0, 4.1, 3.0);
          var cells = [];
          for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
            var cov = K.coverage(poly, x, y);
            if (cov > 0.004) cells.push({ x: x, y: y, cov: cov, bin: cov > 0.12 });
          }
          var ctx = document.getElementById("s04-grid").getContext("2d");
          var tM = Q.w("L06", "measured"), tP = Q.we("L06", "pixel."), tX = Q.w("L06", "Exactly.");
          var sweep = (tP + 0.25 - tM);

          function draw(t) {
            ctx.clearRect(0, 0, 720, 462);
            ctx.strokeStyle = "rgba(20,21,24,0.10)"; ctx.lineWidth = 1.5;
            for (var r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(GX, GY + r * CELL); ctx.lineTo(GX + COLS * CELL, GY + r * CELL); ctx.stroke(); }
            for (var c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(GX + c * CELL, GY); ctx.lineTo(GX + c * CELL, GY + ROWS * CELL); ctx.stroke(); }
            var head = (t - tM) / sweep * (COLS + 2) - 1; // sweep column position
            if (t >= tM) {
              ctx.fillStyle = "rgba(255,90,31,0.10)";
              ctx.fillRect(GX + Math.max(0, Math.min(COLS, head)) * CELL - 6, GY, 12, ROWS * CELL);
            }
            cells.forEach(function (cl) {
              var px = GX + cl.x * CELL, py = GY + cl.y * CELL;
              var fix = E.clamp01((head - cl.x) / 1.2);
              if (cl.bin && fix < 1) {
                ctx.globalAlpha = 1 - fix;
                ctx.fillStyle = "rgba(20,21,24,0.86)";
                ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
              }
              if (fix > 0) {
                ctx.globalAlpha = fix;
                ctx.fillStyle = "rgba(255,90,31," + (0.1 + 0.88 * cl.cov).toFixed(3) + ")";
                ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
                if (cl.cov < 0.985) {
                  ctx.fillStyle = cl.cov > 0.55 ? "#ffffff" : "#141518";
                  ctx.font = "15px 'JetBrains Mono'"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                  ctx.fillText(cl.cov.toFixed(2).replace(/^0/, ""), px + CELL / 2, py + CELL / 2 + 1);
                }
              }
              ctx.globalAlpha = 1;
            });
            ctx.strokeStyle = "#141518"; ctx.lineWidth = 3.5; ctx.lineJoin = "round"; ctx.beginPath();
            poly.forEach(function (q, j) { var X = GX + q[0] * CELL, Y = GY + q[1] * CELL; j ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
            ctx.closePath(); ctx.stroke();
          }

          var tl = gsap.timeline({ paused: true });
          K.drive(tl, D, draw);
          K.sceneIO(tl, "#s04-io", D, { noIn: true });
          tl.fromTo("#s04-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);
          K.caption(tl, document.getElementById("s04-cap"), Q, "L06", [], { only: [0, 6], bold: ["Soham", "Jadhav"] });

          var state = document.getElementById("s04-state");
          var sp = { s: 0 };
          tl.fromTo(sp, { s: 0 }, { s: 1, duration: D, ease: "none", onUpdate: function () {
            var on = sp.s * D >= tM;
            state.textContent = on ? "A3 · exact coverage per pixel" : "Binary mask · whole pixels only";
            state.style.color = on ? "#b8370a" : "#5b43bd";
          } }, 0);
          tl.fromTo("#s04-card", { scale: 1 }, { scale: 1.03, duration: 1.4, ease: "power2.inOut" }, tM);

          // Pix: rescued on "Exactly."
          var P = K.pix(document.getElementById("s04-pix"), 220, "worried");
          K.drawBlockyPix(document.getElementById("s04-blocky").getContext("2d"), 0, 0, 220, 10);
          tl.fromTo("#s04-pix", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, tX - 0.04);
          tl.fromTo("#s04-blocky", { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none" }, tX - 0.04);
          P.mood(tl, tX, "happy", 0.16);
          P.hop(tl, tX + 0.12, 70);
          var sparks = document.getElementById("s04-sparks");
          [[-40, -30, 1], [230, 10, 0.8], [-20, 200, 0.7], [210, 190, 0.9], [100, -70, 0.6]].forEach(function (s, i) {
            var d = document.createElement("div"); d.className = "s04-spark";
            d.style.left = s[0] + "px"; d.style.top = s[1] + "px";
            sparks.appendChild(d);
            tl.fromTo(d, { opacity: 0, scale: 0, rotation: 0 }, { opacity: 1, scale: s[2], rotation: 90, duration: 0.3, ease: "back.out(2.4)" }, tX + 0.02 + i * 0.04);
            tl.fromTo(d, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, tX + 0.5 + i * 0.04);
          });
          tl.fromTo("#s04-exact", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(1.8)" }, tX - 0.05);

          K.buildReady("s04-reveal", K.fontsReady);
          window.__timelines["s04-reveal"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
