<!doctype html>
<!--
  Frame 1 — Hook: the signal (1.5 s).
  A lab oscilloscope beam draws a lead-II heartbeat across the frame; R-peaks land on the beat
  grid (0.0, 0.5, 1.0 s). "WHO BUILDS AI" slams on the first drawn beat, "matters." on the second.
  Phosphor persistence is recomputed from time every frame (seek-safe), after the
  oscilloscope-trace registry block.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo Black"; src: url("vendor/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Fraunces"; src: url("vendor/fonts/fraunces-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #07121a; }
        #f01-cam { position: absolute; inset: 0; transform-origin: 38% 50%; }
        #f01-shake { position: absolute; inset: 0; }
        #f01-glow {
          position: absolute; left: 0; top: 0; width: 1400px; height: 1400px; margin: -700px 0 0 -700px;
          background: radial-gradient(closest-side, rgba(255,125,0,0.20), rgba(120,41,15,0.08) 55%, transparent);
        }
        #f01-scope { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        .f01-head {
          position: absolute; left: 96px; top: 104px; margin: 0;
          font-family: "Archivo Black"; font-size: 150px; line-height: 0.9; letter-spacing: -0.04em;
          color: #ffecd1; white-space: nowrap;
        }
        .f01-head span { display: inline-block; transform-origin: 50% 80%; }
        #f01-matters {
          position: absolute; right: 104px; bottom: 92px; margin: 0;
          font-family: "Fraunces"; font-style: italic; font-weight: 400; font-size: 210px; line-height: 1;
          letter-spacing: -0.02em; color: #ff7d00; text-shadow: 0 0 60px rgba(255,125,0,0.35);
        }
        .f01-hud {
          position: absolute; font-family: "IBM Plex Mono"; font-size: 22px; letter-spacing: 0.16em;
          color: #3e9aa6; text-transform: uppercase; white-space: nowrap;
        }
        #f01-hud-tr { right: 96px; top: 112px; text-align: right; line-height: 1.6; }
        #f01-hud-bl { left: 96px; bottom: 100px; }
        #f01-rec { color: #ff7d00; }
      </style>

      <div id="root" data-composition-id="f01-hook" data-width="1920" data-height="1080" data-duration="1.5">
        <div id="f01-cam" class="clip" data-start="0" data-duration="1.5" data-track-index="0">
          <div id="f01-shake">
            <div id="f01-glow"></div>
            <canvas id="f01-scope" width="1920" height="1080"></canvas>
            <h1 class="f01-head" id="f01-who"><span>WHO</span> <span>BUILDS</span> <span>AI</span></h1>
            <p id="f01-matters">matters.</p>
            <div class="f01-hud" id="f01-hud-tr">CH1 · ECG · 120 BPM<br /><span id="f01-rec">●</span> REC</div>
            <div class="f01-hud" id="f01-hud-bl">LEAD II · 25 MM/S · 10 MM/MV</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var E = K.ease;
          var D = 1.5;
          var X0 = 96, X1 = 1824, BASE = 600, AMP = 260;
          var SPEED = (X1 - X0) / D; // px per second — one sweep per scene
          var TAU = 0.32; // phosphor persistence (s)
          var FLOOR = 0.26; // a monitor keeps the drawn trace faintly lit

          function phase(s) {
            return (s / 0.5) + 0.3; // R-peak (phase 0.30) at s = 0, 0.5, 1.0
          }
          function px(s) { return X0 + SPEED * s; }
          function py(s) { return BASE - AMP * K.ecg(phase(s)); }

          var canvas = document.getElementById("f01-scope");
          var ctx = canvas.getContext("2d");

          // Graticule, drawn once: 120 px divisions, brighter centre axis with minor ticks.
          var grat = document.createElement("canvas");
          grat.width = 1920; grat.height = 1080;
          (function () {
            var g = grat.getContext("2d");
            g.strokeStyle = "rgba(21,97,109,0.30)";
            g.lineWidth = 2;
            for (var x = 0; x <= 1920; x += 120) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1080); g.stroke(); }
            for (var y = 0; y <= 1080; y += 120) { g.beginPath(); g.moveTo(0, y); g.lineTo(1920, y); g.stroke(); }
            g.strokeStyle = "rgba(42,142,156,0.55)";
            g.beginPath(); g.moveTo(0, BASE); g.lineTo(1920, BASE); g.stroke();
            for (var k = 0; k <= 1920; k += 24) { g.beginPath(); g.moveTo(k, BASE - 8); g.lineTo(k, BASE + 8); g.stroke(); }
            // Fade the grid toward the frame edges so it reads as an instrument face, not wallpaper.
            g.globalCompositeOperation = "destination-in";
            var r = g.createRadialGradient(960, 600, 120, 960, 600, 1100);
            r.addColorStop(0, "rgba(0,0,0,1)");
            r.addColorStop(1, "rgba(0,0,0,0.15)");
            g.fillStyle = r;
            g.fillRect(0, 0, 1920, 1080);
          })();

          var glow = document.getElementById("f01-glow");

          function draw(t) {
            ctx.clearRect(0, 0, 1920, 1080);
            ctx.drawImage(grat, 0, 0);
            var dt = 1 / 900;
            var n = Math.max(2, Math.floor(t / dt) + 1);
            var pts = new Array(n), alpha = new Array(n);
            var lRef = SPEED * dt;
            for (var i = 0; i < n; i++) {
              var s = Math.min(t, i * dt);
              pts[i] = [px(s), py(s)];
              var age = t - s;
              var persist = Math.max(FLOOR, Math.exp(-age / TAU));
              var vel = 1;
              if (i > 0) {
                var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
                var len = Math.sqrt(dx * dx + dy * dy);
                vel = len > 1e-6 ? Math.pow(Math.min(1, lRef / len), 0.3) : 1;
              }
              alpha[i] = persist * (0.35 + 0.65 * vel);
            }
            K.drawBeam(ctx, pts, alpha, { width: 4 });
            var hx = px(t), hy = py(t);
            K.glowDot(ctx, hx, hy, 70, "rgba(255,125,0,0.9)", 0.55);
            K.glowDot(ctx, hx, hy, 14, "rgba(255,236,209,1)", 0.9);
            glow.style.transform = "translate(" + hx.toFixed(1) + "px," + hy.toFixed(1) + "px)";
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);

          // Camera: slow push-in across the whole beat, plus a 3-frame shake on each slam.
          tl.fromTo("#f01-cam", { scale: 1.0 }, { scale: 1.03, duration: D, ease: "power1.inOut" }, 0);
          K.shake(tl, "#f01-shake", 0.5, 8, 0.1);
          K.shake(tl, "#f01-shake", 1.0, 11, 0.12);

          // HUD powers on first.
          tl.fromTo(".f01-hud", { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out", stagger: 0.06 }, 0.04);
          // REC dot blinks on the beat grid.
          tl.fromTo("#f01-rec", { opacity: 1 }, { opacity: 0.15, duration: 0.25, ease: "steps(1)", repeat: 2, yoyo: true }, 0.25);

          // "WHO BUILDS AI" — kinetic-beat-slam on the first drawn beat.
          tl.fromTo("#f01-who span", { opacity: 0, scale: 1.45, y: -18 },
            { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(1.6)", stagger: 0.05 }, 0.44);

          // "matters." — the human voice lands on the second beat.
          tl.fromTo("#f01-matters", { opacity: 0, y: 80, rotation: -3 },
            { opacity: 1, y: 0, rotation: 0, duration: 0.42, ease: "expo.out" }, 0.96);
          tl.fromTo("#f01-glow", { opacity: 0.55 }, { opacity: 1, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.98);

          draw(0);
          K.buildReady("f01-hook", K.fontsReady);
          window.__timelines["f01-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
