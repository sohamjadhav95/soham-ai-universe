<!doctype html>
<!--
  Frame 4 — Proof 2: 63× faster than TotalSegmentator (1.0 s).
  Hard cut on the beat. A procedural axial cardiac CT slice (seeded noise, no patient data) gets
  segmentation masks flooding on in quantized scanline steps (segmentation-flood pattern);
  the counter rolls 1× → 63× (counting-dynamic-scale) and slams on the "dub" with a shake.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo Black"; src: url("vendor/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #07121a; }
        #f04-stage { position: absolute; inset: 0; }
        #f04-ghost { position: absolute; right: 40px; bottom: -150px; font-family: "Archivo Black"; font-size: 700px; line-height: 1;
          letter-spacing: -0.06em; color: rgba(42,142,156,0.09); white-space: nowrap; }
        #f04-glow { position: absolute; left: 1000px; top: 160px; width: 980px; height: 760px;
          background: radial-gradient(closest-side, rgba(255,125,0,0.15), rgba(120,41,15,0.06) 60%, transparent); }
        #f04-ct { position: absolute; left: 96px; top: 150px; width: 820px; height: 780px; }
        .f04-mono { position: absolute; font-family: "IBM Plex Mono"; white-space: nowrap; text-transform: uppercase; }
        #f04-ctlabel { left: 120px; top: 150px; font-size: 20px; letter-spacing: 0.18em; color: #3e9aa6; }
        #f04-kicker { left: 1040px; top: 206px; font-weight: 700; font-size: 24px; letter-spacing: 0.22em; color: #ff7d00; }
        #f04-numwrap { position: absolute; left: 1020px; top: 292px; transform-origin: 20% 70%; }
        #f04-num { font-family: "Archivo Black"; font-size: 360px; line-height: 1; letter-spacing: -0.06em; color: #ffecd1; white-space: nowrap; }
        #f04-num .x { color: #ff7d00; }
        #f04-cap { left: 1040px; top: 712px; font-size: 32px; letter-spacing: 0.08em; color: #ffecd1; line-height: 1.4; }
        #f04-cap .dim { color: #bfb29f; }
        #f04-rule { position: absolute; left: 1040px; top: 688px; width: 760px; height: 3px; background: #ff7d00; transform-origin: 0 50%; }
      </style>

      <div id="root" data-composition-id="f04-speed" data-width="1920" data-height="1080" data-duration="1">
        <div id="f04-stage" class="clip" data-start="0" data-duration="1" data-track-index="0">
          <div id="f04-ghost" data-layout-ignore aria-hidden="true">63</div>
          <div id="f04-glow"></div>
          <canvas id="f04-ct" width="820" height="780"></canvas>
          <div class="f04-mono" id="f04-ctlabel">Axial CT · auto-segmentation</div>
          <div class="f04-mono" id="f04-kicker">PrediCT · CAC inference</div>
          <div id="f04-numwrap"><div id="f04-num"><span id="f04-n">1</span><span class="x">×</span></div></div>
          <div id="f04-rule"></div>
          <div class="f04-mono" id="f04-cap">Faster than<br /><span class="dim">TotalSegmentator</span></div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var E = K.ease;
          var D = 1;
          var W = 820, H = 780, CX = 410, CY = 400;

          // Pre-render the CT slice once (seeded speckle): body, lungs, heart, spine, calcium.
          var base = document.createElement("canvas");
          base.width = W; base.height = H;
          var lesions = [[372, 360, 15], [440, 418, 11], [398, 452, 9], [470, 372, 8]];
          (function () {
            var g = base.getContext("2d");
            var rnd = K.prng(63);
            function soft(x, y, rx, ry, inner, outer) {
              g.save(); g.translate(x, y); g.scale(1, ry / rx);
              var gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
              gr.addColorStop(0, inner); gr.addColorStop(0.82, inner); gr.addColorStop(1, outer);
              g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fill(); g.restore();
            }
            g.filter = "blur(1.5px)";
            soft(CX, CY, 372, 302, "#2a4a54", "rgba(42,74,84,0)");          // soft tissue
            soft(CX, CY, 345, 278, "#33555e", "#2a4a54");
            // Ribs: bright arcs around the thoracic wall.
            for (var r = 0; r < 14; r++) {
              var a = -Math.PI * 0.95 + (r / 13) * Math.PI * 1.9;
              if (Math.abs(a - Math.PI / 2) < 0.35) continue;
              soft(CX + Math.cos(a) * 330, CY + Math.sin(a) * 262, 16, 10, "#d8ccb6", "rgba(216,204,182,0)");
            }
            soft(CX - 172, CY - 22, 128, 176, "#091419", "#14262d");         // lungs
            soft(CX + 182, CY - 12, 122, 170, "#091419", "#14262d");
            soft(CX + 24, CY + 14, 132, 112, "#5a7a80", "#3e5c62");          // heart
            soft(CX - 6, CY + 2, 54, 48, "#6f9095", "#5a7a80");               // chamber
            soft(CX - 74, CY + 152, 36, 32, "#6a8d92", "#4f7076");            // aorta
            soft(CX - 10, CY + 232, 58, 50, "#e6d9c1", "#b9ab93");            // vertebra
            soft(CX - 10, CY + 236, 24, 20, "#3a5258", "#3a5258");
            g.filter = "none";
            var img = g.getImageData(0, 0, W, H);
            for (var i = 0; i < img.data.length; i += 4) {
              if (img.data[i + 3] === 0) continue;
              var n = (rnd() - 0.5) * 26;
              img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
            }
            g.putImageData(img, 0, 0);
            lesions.forEach(function (l) {
              var gr = g.createRadialGradient(l[0], l[1], 0, l[0], l[1], l[2]);
              gr.addColorStop(0, "#fff6e6"); gr.addColorStop(0.6, "#e9dcc4"); gr.addColorStop(1, "rgba(233,220,196,0)");
              g.fillStyle = gr; g.beginPath(); g.arc(l[0], l[1], l[2], 0, Math.PI * 2); g.fill();
            });
          })();

          var ctx = document.getElementById("f04-ct").getContext("2d");
          var STEPS = 7, FLOOD_A = 0.05, FLOOD_B = 0.42;

          function draw(t) {
            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(base, 0, 0);
            // Quantized flood: the mask fills the heart + lesions in scanline steps from the top.
            var step = Math.floor(E.clamp01((t - FLOOD_A) / (FLOOD_B - FLOOD_A)) * STEPS);
            var front = CY - 120 + (step / STEPS) * 250;
            ctx.save();
            ctx.beginPath(); ctx.rect(0, 0, W, front); ctx.clip();
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = "#ff7d00";
            ctx.beginPath(); ctx.ellipse(CX + 20, CY + 10, 125, 105, 0, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 0.95;
            lesions.forEach(function (l) { ctx.beginPath(); ctx.arc(l[0], l[1], l[2] * 0.85, 0, Math.PI * 2); ctx.fill(); });
            ctx.restore();
            // 2-frame HUD flicker riding the flood front.
            if (step > 0 && step < STEPS) {
              ctx.globalAlpha = (Math.floor(t * 60) % 2) ? 0.9 : 0.35;
              ctx.fillStyle = "#ffecd1";
              ctx.fillRect(CX - 170, front - 2, 380, 3);
              ctx.globalAlpha = 1;
            }
            // Brackets + CAC chips lock on each lesion once flooded.
            ctx.font = "700 18px 'IBM Plex Mono'";
            ctx.textBaseline = "middle";
            lesions.forEach(function (l, k) {
              var on = E.clamp01((t - (0.3 + k * 0.05)) / 0.12);
              if (on <= 0) return;
              var r = l[2] + 10 + (1 - on) * 30;
              ctx.globalAlpha = on;
              ctx.strokeStyle = "#ffecd1"; ctx.lineWidth = 2;
              var a = 8;
              [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (s) {
                ctx.beginPath();
                ctx.moveTo(l[0] + s[0] * r, l[1] + s[1] * (r - a));
                ctx.lineTo(l[0] + s[0] * r, l[1] + s[1] * r);
                ctx.lineTo(l[0] + s[0] * (r - a), l[1] + s[1] * r);
                ctx.stroke();
              });
              if (k < 2) {
                var lx = l[0] + r + 14, ly = l[1] - r;
                ctx.fillStyle = "#0e2230"; ctx.fillRect(lx, ly - 15, 64, 30);
                ctx.strokeStyle = "#ff7d00"; ctx.strokeRect(lx, ly - 15, 64, 30);
                ctx.fillStyle = "#ff7d00"; ctx.fillText("CAC", lx + 10, ly + 1);
              }
            });
            ctx.globalAlpha = 1;
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);

          tl.fromTo("#f04-ct", { scale: 1.06, opacity: 0.6 }, { scale: 1.0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
          tl.fromTo("#f04-ctlabel", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.05);
          tl.fromTo("#f04-kicker", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.0);
          tl.fromTo("#f04-ghost", { x: 80 }, { x: 0, duration: D, ease: "power2.out" }, 0);

          // counting-dynamic-scale: 1× → 63×, scale grows with value, then the slam.
          var n = document.getElementById("f04-n");
          var cnt = { v: 1 };
          tl.fromTo(cnt, { v: 1 }, {
            v: 63, duration: 0.43, ease: "power2.in",
            onUpdate: function () { n.textContent = String(Math.round(cnt.v)); },
          }, 0.0);
          tl.fromTo("#f04-numwrap", { scale: 0.62, opacity: 0.4 }, { scale: 1.12, opacity: 1, duration: 0.43, ease: "power2.in" }, 0.0);
          tl.fromTo("#f04-numwrap", { scale: 1.12 }, { scale: 1.0, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, 0.45);
          K.shake(tl, "#f04-stage", 0.45, 12, 0.12);
          tl.fromTo("#f04-glow", { opacity: 0.6 }, { opacity: 1, duration: 0.08, yoyo: true, repeat: 1 }, 0.45);

          tl.fromTo("#f04-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power4.out" }, 0.48);
          tl.fromTo("#f04-cap", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0.52);

          draw(0);
          K.buildReady("f04-speed", K.fontsReady);
          window.__timelines["f04-speed"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
