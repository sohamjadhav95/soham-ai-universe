<!doctype html>
<!--
  Frame 6 — Proof 4: Convo-Ease, multimodal moderation (1.5 s).
  constellation-hub + orbit-3d-entry: TEXT / IMAGE / AUDIO cards fly into a real CSS-3D orbit
  around a glowing core, then snap inward on the beat; "< 3 s" slams; the published stamp
  thuds in. Orbit positions are a pure function of time (seek-safe).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo Black"; src: url("vendor/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #07121a; }
        #f06-stage { position: absolute; inset: 0; }
        #f06-rings { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        #f06-space { position: absolute; left: 860px; top: 120px; width: 920px; height: 700px; perspective: 1300px; }
        #f06-orbit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
        #f06-core { position: absolute; left: -110px; top: -110px; width: 220px; height: 220px; border-radius: 50%;
          background: radial-gradient(circle at 42% 38%, #fff3e2 0%, #ffb066 18%, #ff7d00 42%, rgba(120,41,15,0.55) 70%, transparent 72%);
          box-shadow: 0 0 120px 30px rgba(255,125,0,0.35); }
        #f06-corering { position: absolute; left: -170px; top: -170px; width: 340px; height: 340px; border-radius: 50%;
          border: 3px solid rgba(255,125,0,0.6); }
        .f06-card { position: absolute; left: -150px; top: -100px; width: 300px; height: 200px; border-radius: 14px;
          background: #0e2230; border: 2px solid #3e9aa6; box-shadow: 0 30px 70px rgba(0,0,0,0.55);
          backface-visibility: hidden; }
        .f06-card .lab { position: absolute; left: 22px; bottom: 16px; font-family: "IBM Plex Mono"; font-weight: 700; font-size: 22px; letter-spacing: 0.2em; color: #3e9aa6; }
        .f06-card .ico { position: absolute; left: 22px; top: 22px; right: 22px; height: 110px; }
        .f06-aa { font-family: "Archivo Black"; font-size: 96px; line-height: 110px; color: #ffecd1; letter-spacing: -0.04em; }
        .f06-mono { position: absolute; font-family: "IBM Plex Mono"; white-space: nowrap; text-transform: uppercase; }
        #f06-kicker { left: 96px; top: 150px; font-weight: 700; font-size: 24px; letter-spacing: 0.22em; color: #ff7d00; }
        #f06-title { position: absolute; left: 96px; top: 196px; margin: 0; font-family: "Archivo Black"; font-size: 84px; line-height: 0.95;
          letter-spacing: -0.035em; color: #ffecd1; text-transform: uppercase; white-space: nowrap; }
        #f06-big { position: absolute; left: 84px; top: 470px; font-family: "Archivo Black"; font-size: 300px; line-height: 1;
          letter-spacing: -0.06em; color: #ffecd1; white-space: nowrap; transform-origin: 10% 70%; }
        #f06-big .lt { color: #ff7d00; }
        #f06-big .s { font-size: 170px; letter-spacing: -0.02em; }
        #f06-chip { position: absolute; left: 96px; top: 850px; padding: 12px 18px; background: #0e2230; border: 2px solid #3e9aa6; border-radius: 4px;
          font-family: "IBM Plex Mono"; font-weight: 700; font-size: 26px; letter-spacing: 0.04em; color: #ffecd1; white-space: nowrap; }
        #f06-chip b { color: #ff7d00; }
        #f06-stamp { position: absolute; left: 1250px; top: 820px; padding: 16px 26px; border: 4px solid #ff7d00; border-radius: 6px;
          font-family: "IBM Plex Mono"; font-weight: 700; font-size: 30px; letter-spacing: 0.16em; color: #ff7d00; white-space: nowrap;
          transform-origin: 50% 50%; background: rgba(255,125,0,0.08); }
      </style>

      <div id="root" data-composition-id="f06-convo" data-width="1920" data-height="1080" data-duration="1.5">
        <div id="f06-stage" class="clip" data-start="0" data-duration="1.5" data-track-index="0">
          <canvas id="f06-rings" width="1920" height="1080"></canvas>
          <div id="f06-space">
            <div id="f06-orbit">
              <div id="f06-corering"></div>
              <div id="f06-core"></div>
              <div class="f06-card" id="f06-c0"><div class="ico f06-aa">Aa</div><div class="lab">TEXT</div></div>
              <div class="f06-card" id="f06-c1">
                <svg class="ico" viewBox="0 0 256 110"><rect x="2" y="2" width="160" height="104" rx="6" fill="none" stroke="#ffecd1" stroke-width="4"/>
                  <path d="M10 98 L60 50 L95 82 L120 62 L154 98 Z" fill="#ff7d00"/><circle cx="120" cy="30" r="12" fill="#ffecd1"/></svg>
                <div class="lab">IMAGE</div></div>
              <div class="f06-card" id="f06-c2">
                <svg class="ico" viewBox="0 0 256 110"><g fill="#ffecd1">
                  <rect x="0" y="45" width="10" height="20" rx="3"/><rect x="18" y="30" width="10" height="50" rx="3"/><rect x="36" y="12" width="10" height="86" rx="3"/>
                  <rect x="54" y="35" width="10" height="40" rx="3"/><rect x="72" y="5" width="10" height="100" rx="3" fill="#ff7d00"/><rect x="90" y="25" width="10" height="60" rx="3"/>
                  <rect x="108" y="40" width="10" height="30" rx="3"/><rect x="126" y="18" width="10" height="74" rx="3"/><rect x="144" y="44" width="10" height="22" rx="3"/></g></svg>
                <div class="lab">AUDIO</div></div>
            </div>
          </div>
          <div class="f06-mono" id="f06-kicker">Convo-Ease · multimodal moderation</div>
          <h2 id="f06-title">Text · Image · Audio</h2>
          <div id="f06-big"><span class="lt">&lt;</span>3<span class="s">s</span></div>
          <div id="f06-chip"><b>+8.3 PP</b> ACCURACY VS GENERIC SAFETY · p = 0.004</div>
          <div id="f06-stamp">PUBLISHED · SPRINGER NATURE</div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var E = K.ease;
          var D = 1.5;
          var SNAP = 0.75;
          var cards = [0, 1, 2].map(function (i) { return document.getElementById("f06-c" + i); });
          var ring = document.getElementById("f06-rings").getContext("2d");
          var RCX = 860 + 460, RCY = 120 + 350;

          function orbit(t) {
            cards.forEach(function (el, i) {
              var enter = E.expoOut((t - i * 0.18) / 0.4);              // fly in, one per whoosh
              var snap = E.clamp01((t - SNAP + 0.12) / 0.12);            // converge into the core
              var R = (1 - snap) * 380;
              var th = (i / 3) * Math.PI * 2 + t * 2.2 - 0.6;
              var x = Math.cos(th) * R;
              var z = Math.sin(th) * R * 0.85 - (1 - enter) * 1400;   // arrive from deep behind the core
              var y = Math.sin(th * 2 + i) * 30 * (1 - snap);
              var s = (0.9 - 0.55 * snap) * (0.6 + 0.4 * enter);
              var rotY = -th * 57.3 + 90;
              el.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px," + z.toFixed(1) + "px) rotateY(" +
                (rotY * 0.25).toFixed(2) + "deg) scale(" + s.toFixed(3) + ")";
              el.style.opacity = (Math.min(1, enter * 1.4) * (1 - E.clamp01((t - SNAP) / 0.06))).toFixed(3);
              el.style.zIndex = String(Math.round(z + 1000));
            });
            // Expanding shock rings from the core after the snap.
            ring.clearRect(0, 0, 1920, 1080);
            for (var k = 0; k < 3; k++) {
              var u = E.clamp01((t - SNAP - k * 0.09) / 0.5);
              if (u <= 0 || u >= 1) continue;
              ring.strokeStyle = "rgba(255,125,0," + (0.7 * (1 - u)).toFixed(3) + ")";
              ring.lineWidth = 4 * (1 - u) + 1;
              ring.beginPath(); ring.arc(RCX, RCY, 120 + u * 520, 0, Math.PI * 2); ring.stroke();
            }
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { orbit(clock.t); } }, 0);

          tl.fromTo("#f06-core", { scale: 0.4, opacity: 0.2 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 0);
          tl.fromTo("#f06-core", { scale: 1 }, { scale: 1.45, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, SNAP);
          tl.fromTo("#f06-corering", { scale: 0.6, rotation: 0 }, { scale: 1, rotation: 160, duration: D, ease: "sine.inOut" }, 0);
          tl.fromTo("#f06-orbit", { rotationX: 18 }, { rotationX: 8, duration: D, ease: "sine.inOut" }, 0);

          tl.fromTo("#f06-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.0);
          tl.fromTo("#f06-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.06);

          // "< 3 s" slams on the snap.
          tl.fromTo("#f06-big", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2)" }, SNAP);
          K.shake(tl, "#f06-stage", SNAP, 10, 0.12);
          tl.fromTo("#f06-chip", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.95);
          // Stamp: drops from above with rotation, thud shake.
          tl.fromTo("#f06-stamp", { opacity: 0, scale: 2.0, rotation: -2 }, { opacity: 1, scale: 1, rotation: -7, duration: 0.14, ease: "power4.in" }, 0.96);
          K.shake(tl, "#f06-stage", 1.1, 7, 0.1);

          orbit(0);
          K.buildReady("f06-convo", K.fontsReady);
          window.__timelines["f06-convo"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
