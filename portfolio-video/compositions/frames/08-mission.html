<!doctype html>
<!--
  Frame 8 — Promise (2.0 s). The one centered, solemn beat.
  A glass lens rises and turns in front of a giant "BUILDING AI", bending and splitting the type
  through real transmission/dispersion (adapted from the glass-hero registry block). Then the
  human voice — "for Good Faith of Humanity" (Fraunces Italic, Soham's words verbatim) — rises
  word by word, and a light sweep crosses.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Fraunces"; src: url("vendor/fonts/fraunces-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #07121a; }
        #f08-stage { position: absolute; inset: 0; }
        #f08-gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        #f08-bloom { position: absolute; left: 360px; top: 120px; width: 1200px; height: 760px; mix-blend-mode: screen;
          background: radial-gradient(closest-side, rgba(255,125,0,0.22), rgba(120,41,15,0.08) 60%, transparent); }
        #f08-human { position: absolute; left: 0; right: 0; top: 742px; text-align: center; font-family: "Fraunces"; font-style: italic;
          font-weight: 400; font-size: 112px; line-height: 1; letter-spacing: -0.02em; color: #ff7d00; white-space: nowrap;
          text-shadow: 0 0 50px rgba(255,125,0,0.35); }
        #f08-human span { display: inline-block; margin: 0 0.12em; }
        #f08-sweep { position: absolute; left: -700px; top: 0; width: 520px; height: 1080px; mix-blend-mode: overlay;
          background: linear-gradient(100deg, transparent 0%, rgba(255,236,209,0.0) 30%, rgba(255,236,209,0.55) 50%, rgba(255,236,209,0.0) 70%, transparent 100%); }
        #f08-hud { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-family: "IBM Plex Mono"; font-size: 22px;
          letter-spacing: 0.32em; color: #3e9aa6; text-transform: uppercase; }
      </style>

      <div id="root" data-composition-id="f08-mission" data-width="1920" data-height="1080" data-duration="2">
        <div id="f08-stage" class="clip" data-start="0" data-duration="2" data-track-index="0">
          <canvas id="f08-gl" width="1920" height="1080"></canvas>
          <div id="f08-bloom"></div>
          <div id="f08-hud">Mission</div>
          <div id="f08-human"><span>for</span><span>Good</span><span>Faith</span><span>of</span><span>Humanity</span></div>
          <div id="f08-sweep"></div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var D = 2;
          var clock = { t: 0 };
          var host = { clock: clock, render: null };
          window.__f08 = host;
          var built = new Promise(function (resolve) { host.ready = resolve; });

          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { if (host.render) host.render(clock.t); } }, 0);

          // The drop: the frame opens from a signal flash into the glass.
          tl.fromTo("#f08-bloom", { opacity: 1, scale: 1.4 }, { opacity: 0.55, scale: 1, duration: 0.6, ease: "expo.out" }, 0);
          tl.fromTo("#f08-hud", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.1);
          tl.fromTo("#f08-human span", { opacity: 0, y: 70, rotationX: -60 },
            { opacity: 1, y: 0, rotationX: 0, duration: 0.55, ease: "expo.out", stagger: 0.09 }, 0.55);
          tl.fromTo("#f08-sweep", { x: 0 }, { x: 3000, duration: 0.75, ease: "power2.inOut" }, 1.05);
          tl.fromTo("#f08-bloom", { opacity: 0.55 }, { opacity: 0.85, duration: 0.6, ease: "sine.inOut", immediateRender: false }, 1.2);

          K.buildReady("f08-mission", Promise.all([K.fontsReady, built]));
          window.__timelines["f08-mission"] = tl;
        })();
      </script>

      <script type="module">
        import * as THREE from "three";

        const host = window.__f08;
        await window.HFKit.fontsReady;
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("f08-gl"), antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(1920, 1080, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const INK = "#07121a";
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(INK);
        const pmrem = new THREE.PMREMGenerator(renderer);
        const studio = new THREE.Scene();
        studio.background = new THREE.Color(0.03, 0.05, 0.06);
        const softbox = (w, h, x, y, z, r, g, b) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b), side: THREE.DoubleSide }));
          m.position.set(x, y, z); m.lookAt(0, 0, 0); studio.add(m);
        };
        softbox(8, 3, -1, 6, 2, 2.6, 2.4, 2.2);
        softbox(1.6, 9, -7, 0, -1, 7.0, 3.4, 0.6);   // warm signal strip
        softbox(1.2, 9, 7, 0, -1, 0.6, 2.2, 2.6);    // teal strip
        scene.environment = pmrem.fromScene(studio, 0.02).texture;

        const camera = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 100);
        camera.position.set(0, 0, 10);

        // Backdrop: "BUILDING AI" in Archivo Black, drawn at 4K for crisp refraction.
        const c = document.createElement("canvas");
        c.width = 3840; c.height = 2160;
        const g = c.getContext("2d");
        g.fillStyle = INK;
        g.fillRect(0, 0, c.width, c.height);
        const glowG = g.createRadialGradient(1920, 900, 0, 1920, 900, 1500);
        glowG.addColorStop(0, "rgba(255,125,0,0.16)");
        glowG.addColorStop(1, "rgba(255,125,0,0)");
        g.fillStyle = glowG;
        g.fillRect(0, 0, c.width, c.height);
        const text = "BUILDING AI";
        let size = 760;
        g.font = `400 ${size}px "Archivo Black"`;
        while (g.measureText(text).width > 3300 && size > 200) { size -= 10; g.font = `400 ${size}px "Archivo Black"`; }
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillStyle = "#ffecd1";
        g.fillText(text, c.width / 2, c.height * 0.43);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const planeH = 2 * Math.tan(THREE.MathUtils.degToRad(15)) * 12;
        const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(planeH * (1920 / 1080), planeH), new THREE.MeshBasicMaterial({ map: tex }));
        backdrop.position.z = -2;
        scene.add(backdrop);

        const geo = new THREE.SphereGeometry(1.6, 128, 64);
        geo.scale(1, 1, 0.42);
        const glass = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({
          color: 0xffffff, transmission: 1, thickness: 1.1, ior: 1.5, roughness: 0.02, metalness: 0,
          dispersion: 1.1, attenuationColor: new THREE.Color("#ffc58f"), attenuationDistance: 3.0,
          specularIntensity: 1, clearcoat: 1, clearcoatRoughness: 0.04,
        }));
        scene.add(glass);
        const key = new THREE.DirectionalLight(0xfff1dc, 2.4);
        key.position.set(-4, 5, 6);
        scene.add(key);
        const warm = new THREE.PointLight(0xff7d00, 30, 12);
        warm.position.set(2.5, -1.5, 3);
        scene.add(warm);

        const easeOut = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
        host.render = (t) => {
          const rise = easeOut(t / 1.3);
          glass.position.set(-0.75 + 0.85 * easeOut(t / 2.0) + Math.sin(t * 0.8) * 0.1, -3.6 * (1 - rise) + 0.34 + Math.sin(t * 1.1) * 0.05, 1.2);
          glass.scale.setScalar(0.72 + 0.24 * rise);
          glass.rotation.set(Math.sin(t * 0.9) * 0.35, Math.sin(t * 0.7) * 0.5 + 0.2, 0);
          backdrop.scale.setScalar(1.06 - 0.06 * easeOut(t / 2));
          renderer.render(scene, camera);
        };
        host.render(host.clock.t);
        host.ready();
      </script>
    </template>
  </body>
</html>
