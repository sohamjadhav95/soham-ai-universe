<!doctype html>
<!--
  Global overlay (15 s, top of the stack): film grain, vignette, instrument corner ticks, a
  running timecode, the proof index, and the "beam rail" — a thin ECG trace along the bottom
  edge that scrolls through the proof montage (3.5–11.5 s), carrying the heartbeat motif
  between scenes. All drawn as pure functions of time.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #ov-layer { position: absolute; inset: 0; }
        #ov-vig { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0.59; }
        #ov-grain { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0.075; image-rendering: pixelated; }
        #ov-rail { position: absolute; left: 0; top: 990px; width: 1920px; height: 90px; }
        #ov-ticks { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        .ov-mono { position: absolute; font-family: "IBM Plex Mono"; font-size: 20px; letter-spacing: 0.18em; color: #3e9aa6;
          text-transform: uppercase; white-space: nowrap; }
        #ov-tc { right: 56px; top: 34px; }
        #ov-proof { left: 56px; top: 34px; }
        #ov-proof b { color: #ff7d00; font-weight: 400; }
      </style>

      <div id="root" data-composition-id="overlay" data-width="1920" data-height="1080" data-duration="15">
        <div id="ov-layer" class="clip" data-start="0" data-duration="15" data-track-index="0">
          <canvas id="ov-rail" width="1920" height="90" data-layout-ignore data-layout-allow-occlusion></canvas>
          <canvas id="ov-vig" width="1920" height="1080" data-layout-ignore data-layout-allow-occlusion></canvas>
          <svg id="ov-ticks" viewBox="0 0 1920 1080" data-layout-ignore data-layout-allow-occlusion>
            <g fill="none" stroke="#3e9aa6" stroke-width="2" opacity="0.7">
              <path d="M24 56 V24 H56" /><path d="M1864 24 H1896 V56" /><path d="M24 1024 V1056 H56" /><path d="M1864 1056 H1896 V1024" />
            </g>
          </svg>
          <div class="ov-mono" id="ov-proof"></div>
          <div class="ov-mono" id="ov-tc">T+00:00.00</div>
          <canvas id="ov-grain" width="960" height="540" data-layout-ignore data-layout-allow-occlusion></canvas>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var E = K.ease;
          var D = 15;

          // Vignette, painted once: an elliptical falloff toward the corners.
          (function () {
            var v = document.getElementById("ov-vig").getContext("2d");
            v.save();
            v.translate(960, 540);
            v.scale(1, 1080 / 1920);
            var g = v.createRadialGradient(0, 0, 0, 0, 0, 1180);
            g.addColorStop(0, "rgba(3,8,12,0)");
            g.addColorStop(0.55, "rgba(3,8,12,0)");
            g.addColorStop(0.82, "rgba(3,8,12,0.7)");
            g.addColorStop(1, "rgba(3,8,12,1)");
            v.fillStyle = g;
            v.fillRect(-960, -1920, 1920, 3840);
            v.restore();
          })();

          // Grain: 8 seeded noise plates, flipped at 24 fps for a filmic flicker.
          var gctx = document.getElementById("ov-grain").getContext("2d");
          var plates = [];
          var rnd = K.prng(2026);
          for (var p = 0; p < 8; p++) {
            var img = gctx.createImageData(960, 540);
            for (var i = 0; i < img.data.length; i += 4) {
              var v = Math.floor(rnd() * 255);
              img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
            }
            plates.push(img);
          }

          // Proof index (top-left chrome) and timecode (top-right chrome).
          var proofs = [
            [3.5, 6.0, "Proof <b>01</b>/05 · A3 sub-pixel"],
            [6.0, 7.0, "Proof <b>02</b>/05 · CAC inference"],
            [7.0, 8.5, "Proof <b>03</b>/05 · PrediCT Studio"],
            [8.5, 10.0, "Proof <b>04</b>/05 · Convo-Ease"],
            [10.0, 11.5, "Proof <b>05</b>/05 · Copilot"],
          ];
          var proofEl = document.getElementById("ov-proof");
          var tcEl = document.getElementById("ov-tc");

          // Beam rail along the bottom edge: the trace scrolls left, its head at the right.
          var rctx = document.getElementById("ov-rail").getContext("2d");
          var RX0 = 96, RX1 = 1824, RY = 44, RAMP = 22, V = 640; // RY is local to the 90px strip (frame y 1034)
          function rail(t) {
            rctx.clearRect(0, 0, 1920, 90);
            var vis = E.clamp01((t - 3.5) / 0.2) * (1 - E.clamp01((t - 11.3) / 0.2));
            if (vis <= 0) return;
            var pts = [], al = [];
            for (var x = RX0; x <= RX1; x += 3) {
              var s = t - (RX1 - x) / V;                   // when this point was drawn
              var y = RY - RAMP * K.ecg((s - 0.0) / 0.5 + 0.3);
              pts.push([x, y]);
              al.push(vis * (0.15 + 0.85 * Math.exp(-(t - s) / 1.4)));
            }
            K.drawBeam(rctx, pts, al, { width: 2.2 });
            K.glowDot(rctx, RX1, RY - RAMP * K.ecg(t / 0.5 + 0.3), 26, "rgba(255,125,0,0.9)", 0.7 * vis);
          }

          function frame(t) {
            gctx.putImageData(plates[Math.floor(t * 24) % plates.length], 0, 0);
            rail(t);
            var label = "";
            for (var i = 0; i < proofs.length; i++) if (t >= proofs[i][0] && t < proofs[i][1]) label = proofs[i][2];
            proofEl.innerHTML = label;
            var cs = Math.floor(t * 100);
            var sec = Math.floor(cs / 100), hund = cs % 100;
            tcEl.textContent = "T+00:" + (sec < 10 ? "0" : "") + sec + "." + (hund < 10 ? "0" : "") + hund;
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { frame(clock.t); } }, 0);
          tl.fromTo("#ov-ticks, .ov-mono", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.05);

          frame(0);
          K.buildReady("overlay", K.fontsReady);
          window.__timelines["overlay"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
