<!doctype html>
<!--
  Frame 2 — Identity (2.0 s).
  Beveled 3D "SOHAM / JADHAV" in Archivo Black (three.js TextGeometry, typeface generated by
  scripts/make-typeface.mjs) flips up letter by letter onto the heartbeat baseline, lit by a
  signal-orange rim light. HUD brackets lock on; mono readouts decode on the right.
  Adapted from the extruded-logo registry block. Seek-safe: every frame is render(t).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo Black"; src: url("vendor/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #07121a; }
        #f02-stage { position: absolute; inset: 0; }
        #f02-glow {
          position: absolute; left: -200px; top: 120px; width: 1700px; height: 900px;
          background: radial-gradient(closest-side, rgba(255,125,0,0.16), rgba(120,41,15,0.07) 60%, transparent);
        }
        #f02-grid { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0.55; }
        #f02-gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        #f02-beam { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        #f02-brackets { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
        .f02-mono { position: absolute; font-family: "IBM Plex Mono"; white-space: nowrap; text-transform: uppercase; }
        #f02-subject { left: 112px; top: 160px; font-size: 22px; letter-spacing: 0.2em; color: #3e9aa6; }
        #f02-lock { left: 1140px; top: 160px; font-size: 22px; letter-spacing: 0.2em; color: #ff7d00; }
        #f02-read { position: absolute; left: 1396px; top: 520px; width: 430px; }
        .f02-row { position: relative; height: 74px; border-top: 2px solid rgba(42,142,156,0.55); transform-origin: 0 0; }
        .f02-key { position: absolute; left: 0; top: 14px; text-transform: uppercase; font-family: "IBM Plex Mono"; font-size: 20px; letter-spacing: 0.2em; color: #3e9aa6; }
        .f02-val { position: absolute; left: 0; top: 38px; font-family: "IBM Plex Mono"; font-weight: 700; font-size: 28px; letter-spacing: 0.04em; color: #ffecd1; white-space: nowrap; }
        #f02-foot { left: 112px; bottom: 100px; font-size: 22px; letter-spacing: 0.18em; color: #3e9aa6; }
      </style>

      <div id="root" data-composition-id="f02-identity" data-width="1920" data-height="1080" data-duration="2">
        <div id="f02-stage" class="clip" data-start="0" data-duration="2" data-track-index="0">
          <div id="f02-glow"></div>
          <canvas id="f02-grid" width="1920" height="1080"></canvas>
          <canvas id="f02-gl" width="1920" height="1080"></canvas>
          <canvas id="f02-beam" width="1920" height="1080"></canvas>
          <svg id="f02-brackets" viewBox="0 0 1920 1080">
            <g fill="none" stroke="#3e9aa6" stroke-width="3" stroke-linecap="square">
              <path class="f02-br" d="M96 236 V196 H136" />
              <path class="f02-br" d="M1244 196 H1284 V236" />
              <path class="f02-br" d="M96 792 V832 H136" />
              <path class="f02-br" d="M1244 832 H1284 V792" />
            </g>
          </svg>
          <div class="f02-mono" id="f02-subject">Subject 01 · identified</div>
          <div class="f02-mono" id="f02-lock">● Lock</div>
          <div id="f02-read">
            <div class="f02-row"><div class="f02-key">Role</div><div class="f02-val" data-final="AI ENGINEER">AI ENGINEER</div></div>
            <div class="f02-row"><div class="f02-key">Mode</div><div class="f02-val" data-final="RESEARCHER">RESEARCHER</div></div>
            <div class="f02-row"><div class="f02-key">Now</div><div class="f02-val" data-final="GSOC '26 @ ML4SCI">GSOC '26 @ ML4SCI</div></div>
          </div>
          <div class="f02-mono" id="f02-foot">Nashik, IN · AI &amp; data science · open source</div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var E = K.ease;
          var D = 2;
          var BASE_Y = 760;

          // Static instrument grid (faint), drawn once.
          (function () {
            var g = document.getElementById("f02-grid").getContext("2d");
            g.strokeStyle = "rgba(21,97,109,0.22)";
            g.lineWidth = 2;
            for (var x = 0; x <= 1920; x += 120) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1080); g.stroke(); }
            for (var y = 0; y <= 1080; y += 120) { g.beginPath(); g.moveTo(0, y); g.lineTo(1920, y); g.stroke(); }
          })();

          // The flat-lined heartbeat from Frame 1 becomes the baseline the name stands on.
          var bctx = document.getElementById("f02-beam").getContext("2d");
          function drawBeam(t) {
            bctx.clearRect(0, 0, 1920, 1080);
            var reach = 96 + (1824 - 96) * E.expoOut(t / 0.42);
            var n = 160, pts = [], al = [];
            // A soft pulse rides the line on every beat (0.0 / 0.5 / 1.0 / 1.5 s).
            var beatPhase = (t % 0.5) / 0.5;
            var pulseX = 96 + (1824 - 96) * E.cubicOut(beatPhase);
            for (var i = 0; i <= n; i++) {
              var x = 96 + (reach - 96) * (i / n);
              var d = (x - pulseX) / 90;
              var bump = Math.exp(-d * d) * 10 * (1 - beatPhase);
              pts.push([x, BASE_Y - bump]);
              al.push(0.55 + 0.45 * Math.exp(-d * d));
            }
            K.drawBeam(bctx, pts, al, { width: 3 });
            K.glowDot(bctx, reach, BASE_Y, 40, "rgba(255,125,0,0.9)", t < 0.5 ? 0.7 : 0.25);
          }

          var clock = { t: 0 };
          var host = { clock: clock, render: null };
          window.__f02 = host;
          var ready;
          var built = new Promise(function (resolve) { ready = resolve; });
          host.ready = ready;

          var tl = gsap.timeline({ paused: true });
          tl.to(clock, {
            t: D, duration: D, ease: "none",
            onUpdate: function () { drawBeam(clock.t); if (host.render) host.render(clock.t); },
          }, 0);

          // ai-tracking-box: brackets draw on, then the lock indicator.
          tl.fromTo(".f02-br", { strokeDasharray: 90, strokeDashoffset: 90 },
            { strokeDashoffset: 0, duration: 0.3, ease: "expo.out", stagger: 0.05 }, 0.3);
          tl.fromTo("#f02-subject", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.34);
          tl.fromTo("#f02-lock", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "steps(1)", repeat: 3, yoyo: true }, 0.62);
          tl.fromTo("#f02-foot", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.9);

          // Readouts: rule draws, then the value decodes (discrete-text-sequence, deterministic).
          var GLYPHS = "ABCDEFGHJKLMNPRSTUVWXYZ0123456789#@/";
          var rows = document.querySelectorAll("#f02-read .f02-row");
          rows.forEach(function (row, k) {
            var at = 0.72 + k * 0.15;
            tl.fromTo(row, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power4.out" }, at);
            var val = row.querySelector(".f02-val");
            var key = row.querySelector(".f02-key");
            tl.fromTo(key, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, at + 0.04);
            var finalText = val.getAttribute("data-final");
            var proxy = { p: 0 };
            tl.fromTo(proxy, { p: 0 }, {
              p: 1, duration: 0.42, ease: "none",
              onUpdate: function () {
                var locked = Math.floor(proxy.p * finalText.length);
                var tick = Math.floor(proxy.p * 24);
                var s = "";
                for (var i = 0; i < finalText.length; i++) {
                  var ch = finalText[i];
                  s += i < locked || ch === " " ? ch : GLYPHS[(i * 7 + tick * 13 + k * 5) % GLYPHS.length];
                }
                val.textContent = s;
              },
            }, at + 0.06);
            tl.fromTo(val, { opacity: 0 }, { opacity: 1, duration: 0.05 }, at + 0.06);
          });

          drawBeam(0);
          K.buildReady("f02-identity", Promise.all([K.fontsReady, built]));
          window.__timelines["f02-identity"] = tl;
        })();
      </script>

      <script type="module">
        import * as THREE from "three";
        import { FontLoader } from "three/addons/loaders/FontLoader.js";
        import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

        const host = window.__f02;
        const renderer = new THREE.WebGLRenderer({
          canvas: document.getElementById("f02-gl"), antialias: true, alpha: true, preserveDrawingBuffer: true,
        });
        renderer.setPixelRatio(1);
        renderer.setSize(1920, 1080, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;

        const scene = new THREE.Scene();
        // Studio for reflections: white key strip, a hot signal-orange strip behind, teal low fill.
        const studio = new THREE.Scene();
        studio.background = new THREE.Color(0x05090c);
        const softbox = (w, h, x, y, z, color, power) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide }));
          m.position.set(x, y, z); m.lookAt(0, 0, 0); studio.add(m);
        };
        softbox(10, 2, -2, 7, 3, 0xfff1dc, 2.4);
        softbox(1.4, 7, -8, 1, 3, 0xfff1dc, 1.4);
        softbox(12, 1.6, 0, 0.5, -8, 0xff7d00, 4.0);
        softbox(10, 1.2, 4, -5, 4, 0x2a8e9c, 1.2);
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(studio, 0.02).texture;

        const camera = new THREE.PerspectiveCamera(26, 1920 / 1080, 0.1, 100);
        const CAM_Z = 11;
        camera.position.set(0, 0.35, CAM_Z);
        camera.lookAt(0, 0.35, 0);
        const PX = 1080 / (2 * Math.tan(THREE.MathUtils.degToRad(13)) * CAM_Z); // px per world unit at z=0
        const toWorldX = (x) => (x - 960) / PX;
        const toWorldY = (y) => 0.35 + (540 - y) / PX;

        const rim = new THREE.DirectionalLight(0xff7d00, 7);
        rim.position.set(1, 2.5, -6);
        scene.add(rim);
        const key = new THREE.DirectionalLight(0xfff1dc, 2.6);
        key.position.set(-5, 4, 7);
        scene.add(key);
        const fill = new THREE.DirectionalLight(0x2a8e9c, 0.8);
        fill.position.set(6, -3, 4);
        scene.add(fill);

        const material = new THREE.MeshPhysicalMaterial({
          color: 0xffecd1, metalness: 0.08, roughness: 0.42, clearcoat: 0.6, clearcoatRoughness: 0.25,
        });

        const font = await new FontLoader().loadAsync("compositions/assets/fonts/ArchivoBlack.typeface.json");
        const capH = (() => {
          const g = new TextGeometry("H", { font, size: 1, depth: 0.01 });
          g.computeBoundingBox();
          return g.boundingBox.max.y - g.boundingBox.min.y;
        })();
        const CAP_PX = 178;
        const SIZE = CAP_PX / PX / capH;
        const scale = SIZE / font.data.resolution;

        const lines = [
          { text: "SOHAM", baseline: 500 },
          { text: "JADHAV", baseline: 740 },
        ];
        const letters = [];
        for (const line of lines) {
          let cursor = toWorldX(112);
          for (const ch of line.text) {
            const glyph = font.data.glyphs[ch] || font.data.glyphs["?"];
            const advance = glyph.ha * scale;
            const geometry = new TextGeometry(ch, {
              font, size: SIZE, depth: SIZE * 0.32, curveSegments: 8,
              bevelEnabled: true, bevelThickness: SIZE * 0.035, bevelSize: SIZE * 0.022, bevelSegments: 4,
            });
            geometry.computeBoundingBox();
            const b = geometry.boundingBox;
            geometry.translate(-(b.min.x + b.max.x) / 2, 0, -SIZE * 0.16);
            const pivot = new THREE.Group();
            pivot.position.set(cursor + advance / 2, toWorldY(line.baseline), 0);
            pivot.add(new THREE.Mesh(geometry, material));
            scene.add(pivot);
            letters.push(pivot);
            cursor += advance - SIZE * 0.02;
          }
        }

        const clamp01 = (x) => Math.min(1, Math.max(0, x));
        const backOut = (x) => { const u = clamp01(x) - 1; return 1 + 2.4 * u * u * u + 1.4 * u * u; };
        const inOut = (x) => { const u = clamp01(x); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };

        host.render = (t) => {
          letters.forEach((p, i) => {
            const start = 0.1 + i * 0.065;
            const u = backOut((t - start) / 0.5);
            p.rotation.x = (1 - u) * (-Math.PI / 2);
            p.rotation.y = (1 - clamp01((t - start) / 0.9)) * 0.35;
            p.visible = t >= start;
          });
          // The light runs across the bevels as the rim light sweeps; camera eases in slightly.
          const sweep = inOut((t - 0.4) / 1.4);
          rim.position.x = -6 + 12 * sweep;
          key.position.x = -5 + 3 * sweep;
          camera.position.z = CAM_Z + 0.35 * (1 - inOut(t / 2));
          renderer.render(scene, camera);
        };
        host.render(host.clock.t);
        host.ready();
      </script>
    </template>
  </body>
</html>
