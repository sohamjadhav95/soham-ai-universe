<!doctype html>
<!--
  Frame 3 — Proof 1 (hero): solved the sub-pixel problem (2.5 s).
  A radiologist's smooth sub-pixel outline over a 14×9 pixel grid.
    ① binary snap (boundary pixels over-counted, as cv2.fillPoly does) + error tag
    ② Approach 3: every pixel re-fills to its EXACT covered fraction — computed here with
       Sutherland–Hodgman polygon/pixel clipping + shoelace area (HFKit.coverage), the same
       method as Soham's research, not hand-placed numbers
    ③ label area error rolls 10.19% → 0.03% (dataset result, BRIEF.md Facts)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo Black"; src: url("vendor/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #07121a; }
        #f03-stage { position: absolute; inset: 0; }
        #f03-glow {
          position: absolute; left: 860px; top: 120px; width: 1100px; height: 900px;
          background: radial-gradient(closest-side, rgba(255,125,0,0.13), rgba(120,41,15,0.06) 60%, transparent);
        }
        #f03-ghost {
          position: absolute; right: -40px; top: -90px; font-family: "Archivo Black"; font-size: 520px;
          letter-spacing: -0.06em; color: rgba(42,142,156,0.10); line-height: 1; white-space: nowrap;
        }
        #f03-zoom { position: absolute; left: 920px; top: 230px; width: 920px; height: 640px; transform-origin: 72% 18%; }
        #f03-grid { position: absolute; left: 0; top: 0; width: 920px; height: 640px; }
        .f03-mono { position: absolute; font-family: "IBM Plex Mono"; white-space: nowrap; text-transform: uppercase; }
        #f03-state { left: 962px; top: 186px; font-size: 22px; letter-spacing: 0.16em; color: #3e9aa6; }
        #f03-kicker { left: 96px; top: 150px; font-weight: 700; font-size: 24px; letter-spacing: 0.22em; color: #ff7d00; }
        #f03-head { position: absolute; left: 96px; top: 196px; margin: 0; font-family: "Archivo Black"; font-weight: 400;
          font-size: 92px; line-height: 0.95; letter-spacing: -0.035em; color: #ffecd1; text-transform: uppercase; }
        .f03-line { display: block; overflow: hidden; height: 88px; }
        .f03-line > span { display: block; }
        #f03-sub { left: 96px; top: 500px; font-size: 26px; letter-spacing: 0.06em; color: #bfb29f; text-transform: none; }
        #f03-label { left: 96px; top: 580px; font-size: 22px; letter-spacing: 0.18em; color: #3e9aa6; }
        #f03-num { position: absolute; left: 90px; top: 618px; font-family: "Archivo Black"; font-size: 156px; line-height: 1;
          letter-spacing: -0.045em; color: #e5383b; white-space: nowrap; }
        #f03-num .pct { color: #ff7d00; }
        .f03-chip { position: absolute; left: 96px; padding: 12px 18px; background: #0e2230; border: 2px solid #ff7d00; border-radius: 4px;
          font-family: "IBM Plex Mono"; font-weight: 700; font-size: 26px; letter-spacing: 0.04em; color: #ff7d00; white-space: nowrap; }
        #f03-chip1 { top: 800px; }
        #f03-chip2 { top: 872px; border-color: #3e9aa6; color: #ffecd1; }
        #f03-err { position: absolute; left: 1362px; top: 924px; padding: 10px 16px; border: 2px solid #e5383b; border-radius: 4px;
          background: rgba(229,56,59,0.10); font-family: "IBM Plex Mono"; font-weight: 700; font-size: 24px; letter-spacing: 0.06em;
          color: #e5383b; white-space: nowrap; }
        #f03-strike { position: absolute; left: -8px; right: -8px; top: 50%; height: 3px; background: #ffecd1; transform-origin: 0 50%; }
      </style>

      <div id="root" data-composition-id="f03-a3" data-width="1920" data-height="1080" data-duration="2.5">
        <div id="f03-stage" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
          <div id="f03-glow"></div>
          <div id="f03-ghost" data-layout-ignore aria-hidden="true">A3</div>
          <div id="f03-zoom"><canvas id="f03-grid" width="920" height="640"></canvas></div>
          <div class="f03-mono" id="f03-state">Radiologist outline · sub-pixel</div>

          <div class="f03-mono" id="f03-kicker">A3 · Soft coverage</div>
          <h2 id="f03-head">
            <span class="f03-line"><span>Solved the</span></span>
            <span class="f03-line"><span>sub-pixel</span></span>
            <span class="f03-line"><span>problem</span></span>
          </h2>
          <div class="f03-mono" id="f03-sub">PrediCT · coronary calcium CT · GSoC '26</div>
          <div class="f03-mono" id="f03-label">Label area error</div>
          <div id="f03-num"><span id="f03-val">10.19</span><span class="pct">%</span></div>
          <div class="f03-chip" id="f03-chip1">AGATSTON ERROR 2.2× LOWER</div>
          <div class="f03-chip" id="f03-chip2">RISK AGREEMENT 77 → 83%</div>
          <div id="f03-err">+10.19% AREA ERROR<div id="f03-strike"></div></div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var E = K.ease;
          var D = 2.5;
          var COLS = 14, ROWS = 9, CELL = 60, GX = 42, GY = 70; // grid origin inside the 920×640 canvas

          // The lesion: a smooth closed outline with sub-pixel vertices (cell units).
          var poly = [];
          for (var i = 0; i < 96; i++) {
            var th = (i / 96) * Math.PI * 2;
            var r = 3.15 * (1 + 0.16 * Math.sin(3 * th + 0.4) + 0.08 * Math.cos(5 * th + 1.1) + 0.05 * Math.sin(2 * th));
            poly.push([7.0 + r * Math.cos(th) * 1.28, 4.5 + r * Math.sin(th) * 0.92]);
          }
          // Exact coverage per pixel, and the binary (boundary-inclusive) mask.
          var cells = [];
          for (var y = 0; y < ROWS; y++) {
            for (var x = 0; x < COLS; x++) {
              var cov = K.coverage(poly, x, y);
              cells.push({ x: x, y: y, cov: cov, bin: cov > 0.12 });
            }
          }
          var binOrder = cells.filter(function (c) { return c.bin; });

          var canvas = document.getElementById("f03-grid");
          var ctx = canvas.getContext("2d");
          var T = "#15616d", TB = "#3e9aa6", S = "#ff7d00", CR = "#ffecd1", ERR = "#e5383b";

          function cellRect(c) { return [GX + c.x * CELL, GY + c.y * CELL]; }

          function draw(t) {
            ctx.clearRect(0, 0, 920, 640);
            // Grid draws in from the left.
            var gin = E.expoOut(t / 0.35);
            ctx.strokeStyle = "rgba(42,142,156,0.45)";
            ctx.lineWidth = 2;
            for (var r = 0; r <= ROWS; r++) {
              ctx.beginPath(); ctx.moveTo(GX, GY + r * CELL); ctx.lineTo(GX + COLS * CELL * gin, GY + r * CELL); ctx.stroke();
            }
            for (var c = 0; c <= COLS; c++) {
              var a = E.clamp01(gin * (COLS + 4) - c);
              if (a <= 0) continue;
              ctx.globalAlpha = a;
              ctx.beginPath(); ctx.moveTo(GX + c * CELL, GY); ctx.lineTo(GX + c * CELL, GY + ROWS * CELL); ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // ① Binary snap: boundary-inclusive cells pop on in scanline order.
            var binPhaseOut = E.clamp01((t - 1.0) / 0.6); // replaced column by column by ②
            binOrder.forEach(function (c, k) {
              var on = E.clamp01((t - (0.3 + k * 0.0042)) / 0.06);
              if (on <= 0) return;
              var colFix = E.clamp01((t - (1.0 + c.x * 0.035)) / 0.12);
              if (colFix >= 1) return;
              var p = cellRect(c);
              var s = 0.55 + 0.45 * E.backOut(on, 2.2);
              var w = CELL * s, o = (CELL - w) / 2;
              var over = c.cov < 0.5 && t > 0.5;
              ctx.globalAlpha = (1 - colFix) * (over ? 0.9 : 0.85);
              ctx.fillStyle = over ? "rgba(229,56,59,0.55)" : "rgba(21,97,109,0.85)";
              ctx.fillRect(p[0] + o + 2, p[1] + o + 2, w - 4, w - 4);
            });
            ctx.globalAlpha = 1;

            // ② Exact coverage: fill = true fraction; boundary cells print their value.
            cells.forEach(function (c) {
              if (c.cov < 0.015) return;
              var fix = E.clamp01((t - (1.0 + c.x * 0.035)) / 0.12);
              if (fix <= 0) return;
              var p = cellRect(c);
              ctx.globalAlpha = fix;
              ctx.fillStyle = "rgba(255,125,0," + (0.1 + 0.62 * c.cov).toFixed(3) + ")";
              ctx.fillRect(p[0] + 2, p[1] + 2, CELL - 4, CELL - 4);
              if (c.cov < 0.985) {
                ctx.fillStyle = c.cov > 0.55 ? "#07121a" : CR;
                ctx.font = "700 17px 'IBM Plex Mono'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(c.cov.toFixed(2).replace(/^0/, ""), p[0] + CELL / 2, p[1] + CELL / 2 + 1);
              }
            });
            ctx.globalAlpha = 1;

            // The radiologist's outline, drawn on with a beam head, always on top.
            var drawn = E.cubicOut((t - 0.04) / 0.42);
            var n = Math.floor(drawn * poly.length);
            if (n > 1) {
              var pts = [];
              for (var j = 0; j <= n; j++) {
                var q = poly[j % poly.length];
                pts.push([GX + q[0] * CELL, GY + q[1] * CELL]);
              }
              K.drawBeam(ctx, pts, null, { width: 3 });
              if (drawn < 1) K.glowDot(ctx, pts[pts.length - 1][0], pts[pts.length - 1][1], 36, "rgba(255,125,0,0.9)", 0.8);
            }
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);

          // Left column: kicker, masked line reveals, caption.
          tl.fromTo("#f03-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.0);
          tl.fromTo(".f03-line > span", { yPercent: 105 }, { yPercent: 0, duration: 0.5, ease: "expo.out", stagger: 0.06 }, 0.04);
          tl.fromTo("#f03-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
          tl.fromTo("#f03-label", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.4);
          tl.fromTo("#f03-num", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "back.out(1.5)" }, 0.34);
          tl.fromTo("#f03-ghost", { x: 60 }, { x: -40, duration: D, ease: "sine.inOut" }, 0);

          // Grid state captions swap on the beats of the story.
          var state = document.getElementById("f03-state");
          var states = [[0.0, "Radiologist outline · sub-pixel", "#3e9aa6"],
                        [0.3, "Binary mask · cv2.fillPoly", "#ef5457"],
                        [1.0, "A3 · exact coverage per pixel", "#ff7d00"]];
          var stateProxy = { s: 0 };
          tl.fromTo(stateProxy, { s: 0 }, {
            s: 1, duration: D, ease: "none",
            onUpdate: function () {
              var tt = stateProxy.s * D, cur = states[0];
              for (var i = 0; i < states.length; i++) if (tt >= states[i][0]) cur = states[i];
              state.textContent = cur[1];
              state.style.color = cur[2];
            },
          }, 0);
          tl.fromTo(state, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.05);

          // Error tag glitches in with the snap; struck through when A3 fixes it.
          tl.fromTo("#f03-err", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "steps(3)" }, 0.34);
          K.shake(tl, "#f03-err", 0.34, 9, 0.12);
          tl.fromTo("#f03-err", { textShadow: "3px 0 #3e9aa6, -3px 0 #ff7d00" }, { textShadow: "0px 0 #3e9aa6, 0px 0 #ff7d00", duration: 0.25, ease: "steps(5)", immediateRender: false }, 0.34);
          tl.fromTo("#f03-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power4.out" }, 1.55);
          tl.fromTo("#f03-err", { opacity: 1 }, { opacity: 0.45, duration: 0.3, immediateRender: false }, 1.65);

          // Coordinate-target zoom into the boundary as the coverage pass runs.
          tl.fromTo("#f03-zoom", { scale: 1 }, { scale: 1.09, duration: 1.3, ease: "power4.inOut" }, 0.9);

          // ③ The counter: 10.19% → 0.03%, colour turns from error to cream.
          var val = document.getElementById("f03-val");
          var num = { v: 10.19 };
          tl.fromTo(num, { v: 10.19 }, {
            v: 0.03, duration: 0.5, ease: "expo.inOut",
            onUpdate: function () { val.textContent = num.v.toFixed(2); },
          }, 1.6);
          tl.fromTo("#f03-num", { color: "#e5383b" }, { color: "#ffecd1", duration: 0.2, ease: "power2.out", immediateRender: false }, 1.95);
          tl.fromTo("#f03-num", { scale: 1 }, { scale: 1.06, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 50%", immediateRender: false }, 2.08);

          tl.fromTo("#f03-chip1", { opacity: 0, scale: 0.7, x: -20 }, { opacity: 1, scale: 1, x: 0, duration: 0.3, ease: "back.out(1.8)", transformOrigin: "0% 50%" }, 2.12);
          tl.fromTo("#f03-chip2", { opacity: 0, scale: 0.7, x: -20 }, { opacity: 1, scale: 1, x: 0, duration: 0.3, ease: "back.out(1.8)", transformOrigin: "0% 50%" }, 2.28);

          draw(0);
          K.buildReady("f03-a3", K.fontsReady);
          window.__timelines["f03-a3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
