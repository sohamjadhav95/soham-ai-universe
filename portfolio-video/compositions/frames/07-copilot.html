<!doctype html>
<!--
  Frame 7 — Proof 5: Copilot for Data Science (1.5 s).
  prompt-type-submit-generate: a plain-English prompt types in (discrete-text-sequence), submits,
  and explodes into an ML pipeline (depth-scatter-assemble) whose connectors draw on; a slot reel
  rolls the build v1.0 → v4.9 (vertical-spring-ticker). Exits through a zoom-through into the drop.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Archivo Black"; src: url("vendor/fonts/archivo-black-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("vendor/fonts/ibm-plex-mono-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #07121a; }
        #f07-stage { position: absolute; inset: 0; transform-origin: 50% 55%; }
        #f07-glow { position: absolute; left: 300px; top: 420px; width: 1500px; height: 600px;
          background: radial-gradient(closest-side, rgba(255,125,0,0.13), rgba(120,41,15,0.05) 60%, transparent); }
        .f07-mono { position: absolute; font-family: "IBM Plex Mono"; white-space: nowrap; text-transform: uppercase; }
        #f07-kicker { left: 96px; top: 150px; font-weight: 700; font-size: 24px; letter-spacing: 0.22em; color: #ff7d00; }
        #f07-title { position: absolute; left: 96px; top: 196px; margin: 0; font-family: "Archivo Black"; font-size: 84px; line-height: 0.95;
          letter-spacing: -0.035em; color: #ffecd1; text-transform: uppercase; white-space: nowrap; }
        #f07-title .ar { color: #ff7d00; }
        #f07-prompt { position: absolute; left: 96px; top: 330px; width: 1040px; height: 96px; border: 2px solid #15616d; border-radius: 10px;
          background: #0e2230; }
        #f07-ptext { position: absolute; left: 30px; top: 25px; font-family: "IBM Plex Mono"; font-size: 36px; color: #ffecd1; white-space: pre; }
        #f07-ptext .gt { color: #ff7d00; }
        #f07-caret { display: inline-block; width: 16px; height: 38px; margin-left: 4px; background: #ff7d00; vertical-align: -6px; }
        #f07-enter { position: absolute; right: 22px; top: 22px; padding: 10px 16px; border-radius: 6px; border: 2px solid #3e9aa6;
          font-family: "IBM Plex Mono"; font-weight: 700; font-size: 20px; letter-spacing: 0.16em; color: #3e9aa6; }
        #f07-wires { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
        .f07-node { position: absolute; top: 560px; width: 232px; height: 112px; border-radius: 10px; background: #0e2230;
          border: 2px solid #3e9aa6; box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
        .f07-node .i { position: absolute; left: 18px; top: 14px; font-family: "IBM Plex Mono"; font-size: 18px; letter-spacing: 0.16em; color: #3e9aa6; }
        .f07-node .n { position: absolute; left: 18px; top: 46px; font-family: "Archivo Black"; font-size: 40px; letter-spacing: -0.02em; color: #ffecd1; }
        .f07-node.hot { border-color: #ff7d00; }
        .f07-node.hot .n { color: #ff7d00; }
        #f07-cap { left: 96px; top: 740px; font-size: 28px; letter-spacing: 0.06em; color: #bfb29f; }
        #f07-cap b { color: #ffecd1; font-weight: 700; }
        #f07-ver { position: absolute; right: 96px; top: 176px; width: 420px; height: 170px; overflow: hidden; text-align: right; }
        #f07-verlab { right: 96px; top: 150px; font-size: 20px; letter-spacing: 0.2em; color: #3e9aa6; }
        #f07-reel { position: absolute; right: 0; top: 0; }
        .f07-v { height: 170px; font-family: "Archivo Black"; font-size: 150px; line-height: 170px; letter-spacing: -0.05em; color: #ffecd1; white-space: nowrap; }
        .f07-v .d { color: #ff7d00; }
        #f07-flash { position: absolute; inset: 0; background: #ff7d00; mix-blend-mode: screen; }
      </style>

      <div id="root" data-composition-id="f07-copilot" data-width="1920" data-height="1080" data-duration="1.5">
        <div id="f07-wrap" class="clip" data-start="0" data-duration="1.5" data-track-index="0">
          <div id="f07-stage">
            <div id="f07-glow"></div>
            <div class="f07-mono" id="f07-kicker">Copilot for data science</div>
            <h2 id="f07-title">English <span class="ar">→</span> ML pipeline</h2>
            <div class="f07-mono" id="f07-verlab">Build</div>
            <div id="f07-ver"><div id="f07-reel"></div></div>
            <div id="f07-prompt"><div id="f07-ptext"><span class="gt">&gt;</span> <span id="f07-typed"></span><span id="f07-caret"></span></div><div id="f07-enter">↵ RUN</div></div>
            <svg id="f07-wires" viewBox="0 0 1920 1080"></svg>
            <div class="f07-mono" id="f07-cap"><b>~90%</b> of the data-science workflow, automated</div>
          </div>
          <div id="f07-flash"></div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var E = K.ease;
          var D = 1.5;
          var PROMPT = "predict churn from sales.csv";
          var typed = document.getElementById("f07-typed");

          // Pipeline nodes (real stages of the Copilot: AutoML, XAI, RAG).
          var names = ["CLEAN", "FEATURES", "AUTOML", "XAI", "RAG"];
          var stage = document.getElementById("f07-stage");
          var nodes = names.map(function (nm, i) {
            var el = document.createElement("div");
            el.className = "f07-node" + (nm === "AUTOML" ? " hot" : "");
            el.style.left = (96 + i * 352) + "px";
            el.innerHTML = '<div class="i">0' + (i + 1) + '</div><div class="n">' + nm + "</div>";
            stage.appendChild(el);
            return el;
          });
          // Connectors (svg-path-draw), from the prompt down into node 1, then node to node.
          var svg = document.getElementById("f07-wires");
          var paths = [];
          function wire(d) {
            var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", d);
            p.setAttribute("fill", "none");
            p.setAttribute("stroke", "#ff7d00");
            p.setAttribute("stroke-width", "3");
            p.setAttribute("stroke-linecap", "round");
            svg.appendChild(p);
            paths.push(p);
          }
          wire("M 212 428 C 212 500, 212 500, 212 556");
          for (var i = 0; i < 4; i++) {
            var x0 = 96 + i * 352 + 232, x1 = 96 + (i + 1) * 352;
            wire("M " + x0 + " 616 L " + x1 + " 616");
          }

          // Version reel: real phase milestones from the repo, v1.0 → v4.9.
          var versions = ["1.0", "1.6", "2.3", "2.8", "3.5", "3.8", "4.2", "4.5", "4.9"];
          var reel = document.getElementById("f07-reel");
          versions.forEach(function (v) {
            var el = document.createElement("div");
            el.className = "f07-v";
            el.innerHTML = "v" + v.replace(".", '<span class="d">.</span>');
            reel.appendChild(el);
          });

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(clock, {
            t: D, duration: D, ease: "none",
            onUpdate: function () {
              var t = clock.t;
              var n = Math.min(PROMPT.length, Math.max(0, Math.floor((t - 0.02) / 0.5 * PROMPT.length)));
              typed.textContent = PROMPT.slice(0, n);
              document.getElementById("f07-caret").style.opacity = (t < 0.55 ? 1 : (Math.floor(t * 4) % 2 ? 0.2 : 1)).toString();
            },
          }, 0);

          tl.fromTo("#f07-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0);
          tl.fromTo("#f07-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.04);
          tl.fromTo("#f07-prompt", { opacity: 0, scaleX: 0.85 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power4.out", transformOrigin: "0% 50%" }, 0);

          // Submit: the bar flashes signal, the RUN key presses.
          tl.fromTo("#f07-prompt", { borderColor: "#15616d" }, { borderColor: "#ff7d00", duration: 0.06, ease: "none", immediateRender: false }, 0.55);
          tl.fromTo("#f07-enter", { scale: 1, color: "#3e9aa6", borderColor: "#3e9aa6" },
            { scale: 0.9, color: "#ff7d00", borderColor: "#ff7d00", duration: 0.06, yoyo: true, repeat: 1, ease: "power2.out" }, 0.55);

          // depth-scatter-assemble: nodes fly in from scattered depth to the row.
          nodes.forEach(function (el, i) {
            var sx = [-260, 140, -90, 300, 180][i], sy = [-220, 160, -280, 240, -150][i], rz = [-18, 12, -8, 16, -12][i];
            tl.fromTo(el, { opacity: 0, x: sx, y: sy, scale: 0.35, rotation: rz },
              { opacity: 1, x: 0, y: 0, scale: 1, rotation: 0, duration: 0.42, ease: "expo.out" }, 0.6 + i * 0.1);
          });
          paths.forEach(function (p, i) {
            var len = p.getTotalLength();
            tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, 0.56 + i * 0.1);
          });
          tl.fromTo("#f07-cap", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.95);

          // Slot reel v1.0 → v4.9 with stepped spring settle.
          tl.fromTo("#f07-verlab", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.1);
          tl.fromTo("#f07-reel", { y: 0 }, { y: -(versions.length - 1) * 170, duration: 0.32, ease: "back.out(1.3)" }, 0.9);
          tl.fromTo("#f07-ver", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.1);

          // Exit: zoom-through + signal flash into the drop (11.5 s).
          tl.fromTo("#f07-stage", { scale: 1, filter: "blur(0px)" }, { scale: 1.45, filter: "blur(14px)", duration: 0.22, ease: "power3.in", immediateRender: false }, 1.28);
          tl.fromTo("#f07-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.2, ease: "power2.in" }, 1.3);

          K.buildReady("f07-copilot", K.fontsReady);
          window.__timelines["f07-copilot"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
