<!doctype html>
<!--
  Chapter 3 — Breakthrough (4.0 s): solved the sub-pixel problem.
  Light-theme A3 grid on a glass card: binary mask snaps (over-count cells in red) → each pixel refills
  in cobalt to its EXACT coverage (HFKit.coverage: Sutherland–Hodgman + shoelace), values printed →
  label area error 10.19% → 0.03%, then the Agatston and risk-agreement pills.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Geist"; src: url("vendor/fonts/geist-sans-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Geist"; src: url("vendor/fonts/geist-sans-600.woff2") format("woff2"); font-weight: 600; }
        @font-face { font-family: "Geist"; src: url("vendor/fonts/geist-sans-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Geist"; src: url("vendor/fonts/geist-sans-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Geist Mono"; src: url("vendor/fonts/geist-mono-500.woff2") format("woff2"); font-weight: 500; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f03-io { position: absolute; inset: 0; }
        #f03-chapter { position: absolute; left: 120px; top: 190px; font-family: "Geist Mono"; font-weight: 500; font-size: 24px; letter-spacing: 0.18em; color: #2747f5; text-transform: uppercase; }
        #f03-statement { position: absolute; left: 120px; top: 234px; margin: 0; font-family: "Geist"; font-weight: 700; font-size: 92px; line-height: 1.02; letter-spacing: -0.045em; color: #111317; }
        .f03-line { display: block; overflow: hidden; padding-bottom: 0.06em; }
        .f03-line > span { display: block; }
        #f03-sub { position: absolute; left: 120px; top: 456px; font-family: "Geist"; font-weight: 400; font-size: 32px; color: #454a52; }
        #f03-label { position: absolute; left: 120px; top: 548px; font-family: "Geist Mono"; font-weight: 500; font-size: 22px; letter-spacing: 0.16em; color: #454a52; text-transform: uppercase; }
        #f03-num { position: absolute; left: 112px; top: 584px; font-family: "Geist"; font-weight: 800; font-size: 150px; line-height: 1; letter-spacing: -0.06em; color: #454a52; white-space: nowrap; transform-origin: 0 60%; }
        .f03-pill { position: absolute; left: 120px; padding: 14px 26px; border-radius: 999px; background: #e6ebff; color: #1f3ce6;
          font-family: "Geist"; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; white-space: nowrap; transform-origin: 0 50%; }
        #f03-pill1 { top: 790px; }
        #f03-pill2 { top: 870px; }
        #f03-persp { position: absolute; left: 1040px; top: 196px; width: 760px; height: 600px; perspective: 2000px; }
        #f03-card { position: absolute; inset: 0; border-radius: 32px; background: rgba(255,255,255,0.8); border: 1px solid rgba(17,19,23,0.08);
          box-shadow: 0 60px 100px -36px rgba(17,19,23,0.24), 0 16px 30px -16px rgba(17,19,23,0.14), inset 0 1px 0 rgba(255,255,255,0.95); }
        #f03-state { position: absolute; left: 60px; top: 46px; font-family: "Geist Mono"; font-weight: 500; font-size: 22px; letter-spacing: 0.14em; color: #454a52; text-transform: uppercase; white-space: nowrap; }
        #f03-grid { position: absolute; left: 60px; top: 112px; width: 640px; height: 432px; transform-origin: 70% 30%; }
      </style>

      <div id="root" data-composition-id="f03-a3" data-width="1920" data-height="1080" data-duration="4">
        <div id="f03-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
          <div id="f03-io">
            <div id="f03-chapter">Breakthrough</div>
            <h2 id="f03-statement">
              <span class="f03-line"><span>Solved the</span></span>
              <span class="f03-line"><span>sub-pixel problem.</span></span>
            </h2>
            <div id="f03-sub">PrediCT · coronary calcium CT · A3 soft coverage</div>
            <div id="f03-label">Label area error</div>
            <div id="f03-num" data-layout-allow-overlap><span id="f03-val" data-layout-allow-overlap>10.19</span>%</div>
            <div class="f03-pill" id="f03-pill1">Agatston error 2.2× lower</div>
            <div class="f03-pill" id="f03-pill2">Risk agreement 77% → 83%</div>
            <div id="f03-persp">
              <div id="f03-card">
                <div id="f03-state">Radiologist outline · sub-pixel</div>
                <canvas id="f03-grid" width="640" height="432"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var E = K.ease;
          var D = 4;
          var COLS = 14, ROWS = 9, CELL = 44, GX = 12, GY = 18;

          var poly = [];
          for (var i = 0; i < 96; i++) {
            var th = (i / 96) * Math.PI * 2;
            var r = 3.15 * (1 + 0.16 * Math.sin(3 * th + 0.4) + 0.08 * Math.cos(5 * th + 1.1) + 0.05 * Math.sin(2 * th));
            poly.push([7.0 + r * Math.cos(th) * 1.28, 4.5 + r * Math.sin(th) * 0.92]);
          }
          var cells = [];
          for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
            var cov = K.coverage(poly, x, y);
            cells.push({ x: x, y: y, cov: cov, bin: cov > 0.12 });
          }
          var binOrder = cells.filter(function (c) { return c.bin; });
          var ctx = document.getElementById("f03-grid").getContext("2d");

          function draw(t) {
            ctx.clearRect(0, 0, 640, 432);
            var gin = E.expoOut((t - 0.2) / 0.5);
            ctx.strokeStyle = "rgba(17,19,23,0.12)";
            ctx.lineWidth = 1.5;
            for (var r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(GX, GY + r * CELL); ctx.lineTo(GX + COLS * CELL * gin, GY + r * CELL); ctx.stroke(); }
            for (var c = 0; c <= COLS; c++) {
              var a = E.clamp01(gin * (COLS + 4) - c);
              if (a <= 0) continue;
              ctx.globalAlpha = a;
              ctx.beginPath(); ctx.moveTo(GX + c * CELL, GY); ctx.lineTo(GX + c * CELL, GY + ROWS * CELL); ctx.stroke();
            }
            ctx.globalAlpha = 1;
            // ① binary snap (boundary-inclusive, as cv2.fillPoly over-counts)
            binOrder.forEach(function (cl, k) {
              var on = E.clamp01((t - (0.85 + k * 0.0038)) / 0.06);
              if (on <= 0) return;
              var fix = E.clamp01((t - (1.7 + cl.x * 0.04)) / 0.14);
              if (fix >= 1) return;
              var over = cl.cov < 0.5 && t > 1.0;
              var s = 0.6 + 0.4 * E.backOut(on, 2);
              var w = CELL * s, o = (CELL - w) / 2;
              ctx.globalAlpha = 1 - fix;
              ctx.fillStyle = over ? "rgba(229,72,77,0.85)" : "rgba(17,19,23,0.82)";
              ctx.fillRect(GX + cl.x * CELL + o + 2, GY + cl.y * CELL + o + 2, w - 4, w - 4);
            });
            ctx.globalAlpha = 1;
            // ② exact coverage, values printed on boundary pixels
            cells.forEach(function (cl) {
              if (cl.cov < 0.015) return;
              var fix = E.clamp01((t - (1.7 + cl.x * 0.04)) / 0.14);
              if (fix <= 0) return;
              var px = GX + cl.x * CELL, py = GY + cl.y * CELL;
              ctx.globalAlpha = fix;
              ctx.fillStyle = "rgba(39,71,245," + (0.12 + 0.82 * cl.cov).toFixed(3) + ")";
              ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
              if (cl.cov < 0.985) {
                ctx.fillStyle = cl.cov > 0.5 ? "#ffffff" : "#111317";
                ctx.font = "500 14px 'Geist Mono'";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(cl.cov.toFixed(2).replace(/^0/, ""), px + CELL / 2, py + CELL / 2 + 1);
              }
            });
            ctx.globalAlpha = 1;
            // the radiologist's outline, always on top
            var drawn = E.cubicOut((t - 0.3) / 0.5);
            var n = Math.floor(drawn * poly.length);
            if (n > 1) {
              ctx.strokeStyle = "#111317";
              ctx.lineWidth = 3;
              ctx.lineJoin = "round";
              ctx.beginPath();
              for (var j = 0; j <= n; j++) {
                var q = poly[j % poly.length];
                var X = GX + q[0] * CELL, Y = GY + q[1] * CELL;
                if (j === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
              }
              ctx.stroke();
            }
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);
          K.sceneIO(tl, "#f03-io", D);
          tl.fromTo("#f03-chapter", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
          tl.fromTo(".f03-line > span", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out", stagger: 0.08 }, 0.12);
          tl.fromTo("#f03-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.45);
          tl.fromTo("#f03-label, #f03-num", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.06 }, 0.6);
          tl.fromTo("#f03-card", { opacity: 0, y: 120, rotationX: 18, rotationY: 16 },
            { opacity: 1, y: 0, rotationX: 0, rotationY: 6, duration: 0.85, ease: "back.out(1.2)" }, 0.1);
          tl.fromTo("#f03-card", { rotationY: 6 }, { rotationY: 0, duration: 2.8, ease: "sine.inOut", immediateRender: false }, 0.95);
          tl.fromTo("#f03-grid", { scale: 1 }, { scale: 1.06, duration: 1.6, ease: "power2.inOut" }, 1.6);

          var state = document.getElementById("f03-state");
          var states = [[0, "Radiologist outline · sub-pixel", "#454a52"], [0.85, "Binary mask · +10.19% area error", "#c8282d"], [1.7, "A3 · exact coverage per pixel", "#1f3ce6"]];
          var sp = { s: 0 };
          tl.fromTo(sp, { s: 0 }, { s: 1, duration: D, ease: "none", onUpdate: function () {
            var tt = sp.s * D, cur = states[0];
            for (var i = 0; i < states.length; i++) if (tt >= states[i][0]) cur = states[i];
            state.textContent = cur[1]; state.style.color = cur[2];
          } }, 0);

          K.countUp(tl, document.getElementById("f03-val"), 10.19, 0.03, 2.4, 0.55, function (v) { return v.toFixed(2); }, "expo.inOut");
          tl.fromTo("#f03-num", { color: "#454a52" }, { color: "#1f3ce6", duration: 0.25, ease: "power2.out", immediateRender: false }, 2.8);
          tl.fromTo("#f03-num", { scale: 1 }, { scale: 1.05, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 2.95);
          tl.fromTo("#f03-pill1", { opacity: 0, scale: 0.8, x: -16 }, { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 3.05);
          tl.fromTo("#f03-pill2", { opacity: 0, scale: 0.8, x: -16 }, { opacity: 1, scale: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 3.25);

          draw(0);
          K.buildReady("f03-a3", K.fontsReady);
          window.__timelines["f03-a3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
