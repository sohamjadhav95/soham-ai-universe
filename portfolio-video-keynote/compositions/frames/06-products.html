<!doctype html>
<!--
  Chapter 6 — Products (4.5 s): "Built to be used."
  camera-journey across a 3D shelf of five glass project cards. The camera trucks to each card on its
  cue (0.45 / 1.25 / 2.05 / 2.85 / 3.65 s); every card's tilt, depth, scale and focus ring are computed
  from its distance to frame centre each frame (pure function of time — seek-safe).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Geist"; src: url("vendor/fonts/geist-sans-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Geist"; src: url("vendor/fonts/geist-sans-700.woff2") format("woff2"); font-weight: 700; }
        @font-face { font-family: "Geist"; src: url("vendor/fonts/geist-sans-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Geist Mono"; src: url("vendor/fonts/geist-mono-500.woff2") format("woff2"); font-weight: 500; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f06-io { position: absolute; inset: 0; }
        #f06-chapter { position: absolute; left: 120px; top: 150px; font-family: "Geist Mono"; font-weight: 500; font-size: 24px; letter-spacing: 0.18em; color: #2747f5; text-transform: uppercase; }
        #f06-statement { position: absolute; left: 120px; top: 192px; margin: 0; font-family: "Geist"; font-weight: 700; font-size: 96px; line-height: 1.0; letter-spacing: -0.045em; color: #111317; }
        .f06-line { display: block; overflow: hidden; padding-bottom: 0.06em; }
        .f06-line > span { display: block; }
        #f06-count { position: absolute; right: 120px; top: 222px; font-family: "Geist Mono"; font-weight: 500; font-size: 24px; letter-spacing: 0.14em; color: #454a52; text-transform: uppercase; }
        #f06-count b { color: #1f3ce6; font-weight: 500; }
        #f06-persp { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 1700px; }
        #f06-row { position: absolute; left: 0; top: 410px; width: 2000px; height: 470px; transform-style: preserve-3d; }
        .f06-card { position: absolute; top: 0; width: 340px; height: 450px; border-radius: 30px; background: rgba(255,255,255,0.84);
          border: 1px solid rgba(17,19,23,0.08); box-shadow: 0 50px 90px -34px rgba(17,19,23,0.24), 0 14px 26px -14px rgba(17,19,23,0.14), inset 0 1px 0 rgba(255,255,255,0.95); }
        .f06-ring { position: absolute; inset: -3px; border-radius: 32px; border: 3px solid #2747f5; }
        .f06-ico { position: absolute; left: 34px; top: 34px; width: 64px; height: 64px; border-radius: 18px; background: #e6ebff; }
        .f06-ico svg { position: absolute; left: 14px; top: 14px; width: 36px; height: 36px; }
        .f06-name { position: absolute; left: 34px; right: 30px; top: 124px; font-family: "Geist"; font-weight: 700; font-size: 34px; line-height: 1.08; letter-spacing: -0.025em; color: #111317; }
        .f06-stat { position: absolute; left: 32px; top: 222px; font-family: "Geist"; font-weight: 800; font-size: 76px; line-height: 1; letter-spacing: -0.055em; color: #1f3ce6; white-space: nowrap; }
        .f06-stat.small { font-size: 56px; top: 236px; }
        .f06-cap { position: absolute; left: 34px; right: 30px; top: 320px; font-family: "Geist"; font-weight: 400; font-size: 25px; line-height: 1.3; color: #454a52; }
      </style>

      <div id="root" data-composition-id="f06-products" data-width="1920" data-height="1080" data-duration="4.5">
        <div id="f06-stage" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
          <div id="f06-io">
            <div id="f06-chapter">Products</div>
            <h2 id="f06-statement"><span class="f06-line"><span>Built to be used.</span></span></h2>
            <div id="f06-count"><b id="f06-idx">01</b> / 05</div>
            <div id="f06-persp">
              <div id="f06-row">
                <div class="f06-card" data-layout-allow-overflow>
                  <div class="f06-ring"></div>
                  <div class="f06-ico"><svg viewBox="0 0 36 36"><path d="M4 8a4 4 0 0 1 4-4h20a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H15l-7 6v-6H8a4 4 0 0 1-4-4z" fill="#2747f5"/></svg></div>
                  <div class="f06-name">Convo-Ease</div>
                  <div class="f06-stat">&lt; 3 s</div>
                  <div class="f06-cap">Text, image &amp; audio moderation. Published.</div>
                </div>
                <div class="f06-card" data-layout-allow-overflow>
                  <div class="f06-ring"></div>
                  <div class="f06-ico"><svg viewBox="0 0 36 36"><path d="M18 2l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#2747f5"/></svg></div>
                  <div class="f06-name">Copilot for Data Science</div>
                  <div class="f06-stat">~90%</div>
                  <div class="f06-cap">of the data-science workflow, automated.</div>
                </div>
                <div class="f06-card" data-layout-allow-overflow>
                  <div class="f06-ring"></div>
                  <div class="f06-ico"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="14" fill="#2747f5"/><path d="M8 9c6 4 6 14 0 18M28 9c-6 4-6 14 0 18" stroke="#e6ebff" stroke-width="2.5" fill="none"/></svg></div>
                  <div class="f06-name">Tennis Match Predictor</div>
                  <div class="f06-stat">77%</div>
                  <div class="f06-cap">ATP outcome accuracy. XGBoost + LightGBM.</div>
                </div>
                <div class="f06-card" data-layout-allow-overflow>
                  <div class="f06-ring"></div>
                  <div class="f06-ico"><svg viewBox="0 0 36 36"><rect x="6" y="3" width="24" height="30" rx="3" fill="#2747f5"/><path d="M11 11h14M11 17h14M11 23h9" stroke="#e6ebff" stroke-width="2.5"/></svg></div>
                  <div class="f06-name">RenAIssance OCR</div>
                  <div class="f06-stat small">CRNN</div>
                  <div class="f06-cap">Historical Spanish handwriting to text.</div>
                </div>
                <div class="f06-card" data-layout-allow-overflow>
                  <div class="f06-ring"></div>
                  <div class="f06-ico"><svg viewBox="0 0 36 36"><g fill="#2747f5"><rect x="3" y="14" width="4" height="8" rx="2"/><rect x="10" y="9" width="4" height="18" rx="2"/><rect x="17" y="4" width="4" height="28" rx="2"/><rect x="24" y="10" width="4" height="16" rx="2"/><rect x="31" y="15" width="3" height="6" rx="1.5"/></g></svg></div>
                  <div class="f06-name">NexaOS Flow</div>
                  <div class="f06-stat small">Voice → OS</div>
                  <div class="f06-cap">Natural language runs system commands.</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var E = K.ease;
          var D = 4.5;
          var STEP = 390, W = 340, CENTER = 960;
          var cards = Array.prototype.slice.call(document.querySelectorAll("#f06-row .f06-card"));
          cards.forEach(function (c, i) { c.style.left = (i * STEP) + "px"; });
          var rings = cards.map(function (c) { return c.querySelector(".f06-ring"); });
          var row = document.getElementById("f06-row");
          var idx = document.getElementById("f06-idx");
          var FOCUS = [0.45, 1.25, 2.05, 2.85, 3.65];
          function target(i) { return CENTER - (i * STEP + W / 2); }

          function rowX(t) {
            if (t <= FOCUS[0]) return target(0) + 900 * (1 - E.cubicOut(t / FOCUS[0]));
            for (var k = 0; k < FOCUS.length - 1; k++) {
              var a = FOCUS[k + 1] - 0.5, b = FOCUS[k + 1];
              if (t < a) return target(k);
              if (t < b) return target(k) + (target(k + 1) - target(k)) * E.cubicInOut((t - a) / (b - a));
            }
            return target(FOCUS.length - 1);
          }

          function frame(t) {
            var x = rowX(t);
            row.style.transform = "translateX(" + x.toFixed(1) + "px)";
            var best = 0, bestW = -1;
            cards.forEach(function (c, i) {
              var cx = x + i * STEP + W / 2;
              var d = (cx - CENTER) / STEP;
              var w = Math.max(0, 1 - Math.abs(d));
              if (w > bestW) { bestW = w; best = i; }
              c.style.transform = "translateZ(" + (-Math.min(2.5, Math.abs(d)) * 150).toFixed(1) + "px) rotateY(" +
                (-Math.max(-2.5, Math.min(2.5, d)) * 16).toFixed(2) + "deg) scale(" + (0.94 + 0.1 * w).toFixed(3) + ")";
              c.style.opacity = (0.42 + 0.58 * w).toFixed(3);
              rings[i].style.opacity = (w * w).toFixed(3);
            });
            idx.textContent = "0" + (best + 1);
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { frame(clock.t); } }, 0);
          K.sceneIO(tl, "#f06-io", D);
          tl.fromTo("#f06-chapter", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
          tl.fromTo(".f06-line > span", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.1);
          tl.fromTo("#f06-count", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.4);
          frame(0);
          K.buildReady("f06-products", K.fontsReady);
          window.__timelines["f06-products"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
