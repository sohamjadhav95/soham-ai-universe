<!doctype html>
<!--
  Chapter 1 — Introducing (3.0 s).
  The hero object: an extruded "SJ" monogram (three.js TextGeometry, Geist 800 typeface generated by
  scripts/make-typeface.mjs): S in glossy ceramic, J in cobalt, lit by a studio environment, turning
  slowly over a contact shadow. Below it: "Introducing" → "Soham Jadhav." → the roles line.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Geist"; src: url("vendor/fonts/geist-sans-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Geist"; src: url("vendor/fonts/geist-sans-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Geist Mono"; src: url("vendor/fonts/geist-mono-500.woff2") format("woff2"); font-weight: 500; }
        #root { position: absolute; inset: 0; overflow: hidden; }
        #f01-io { position: absolute; inset: 0; }
        #f01-gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #f01-shadow { position: absolute; left: 740px; top: 478px; width: 440px; height: 56px;
          background: radial-gradient(closest-side, rgba(17,19,23,0.22), rgba(17,19,23,0)); }
        #f01-kicker { position: absolute; left: 0; right: 0; top: 596px; text-align: center; font-family: "Geist Mono"; font-weight: 500;
          font-size: 26px; letter-spacing: 0.34em; color: #454a52; text-transform: uppercase; }
        #f01-name { position: absolute; left: 0; right: 0; top: 640px; margin: 0; text-align: center; font-family: "Geist"; font-weight: 800;
          font-size: 160px; line-height: 1; letter-spacing: -0.055em; color: #111317; white-space: nowrap; }
        .f01-mask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 0.04em 0.08em; }
        .f01-mask > span { display: inline-block; }
        #f01-roles { position: absolute; left: 0; right: 0; top: 832px; text-align: center; font-family: "Geist"; font-weight: 400;
          font-size: 38px; letter-spacing: -0.01em; color: #454a52; }
        #f01-roles b { color: #2747f5; font-weight: 400; padding: 0 12px; }
      </style>

      <div id="root" data-composition-id="f01-intro" data-width="1920" data-height="1080" data-duration="3">
        <div id="f01-stage" class="clip" data-start="0" data-duration="3" data-track-index="0">
          <div id="f01-io">
            <div id="f01-shadow"></div>
            <canvas id="f01-gl" width="1920" height="1080"></canvas>
            <div id="f01-kicker">Introducing</div>
            <h1 id="f01-name"><span class="f01-mask"><span>Soham</span></span> <span class="f01-mask"><span>Jadhav.</span></span></h1>
            <div id="f01-roles">AI Engineer<b>·</b>Researcher<b>·</b>Open-source developer</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var K = window.HFKit;
          var D = 3;
          var clock = { t: 0 };
          var host = { clock: clock, render: null };
          window.__k01 = host;
          var built = new Promise(function (resolve) { host.ready = resolve; });

          var tl = gsap.timeline({ paused: true });
          tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { if (host.render) host.render(clock.t); } }, 0);
          K.sceneIO(tl, "#f01-io", D, { noIn: true });
          tl.fromTo("#f01-shadow", { opacity: 0, scaleX: 0.5 }, { opacity: 1, scaleX: 1, duration: 1.2, ease: "power3.out" }, 0.1);
          tl.fromTo("#f01-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.65);
          tl.fromTo(".f01-mask > span", { yPercent: 105 }, { yPercent: 0, duration: 0.75, ease: "expo.out", stagger: 0.09 }, 1.0);
          tl.fromTo("#f01-roles", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.4);

          K.buildReady("f01-intro", Promise.all([K.fontsReady, built]));
          window.__timelines["f01-intro"] = tl;
        })();
      </script>

      <script type="module">
        import * as THREE from "three";
        import { FontLoader } from "three/addons/loaders/FontLoader.js";
        import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
        import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

        const host = window.__k01;
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("f01-gl"), antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(1920, 1080, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.NeutralToneMapping;
        renderer.toneMappingExposure = 0.95;

        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        const camera = new THREE.PerspectiveCamera(24, 1920 / 1080, 0.1, 100);
        camera.position.set(0, 0.35, 12);
        camera.lookAt(0, 1.05, 0);

        const key = new THREE.DirectionalLight(0xffffff, 2.2);
        key.position.set(-4, 6, 6);
        scene.add(key);
        const rim = new THREE.DirectionalLight(0xdfe6ff, 1.2);
        rim.position.set(5, 2, -5);
        scene.add(rim);

        const ceramic = new THREE.MeshPhysicalMaterial({ color: 0xe4e2dc, roughness: 0.3, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.08 });
        const cobalt = new THREE.MeshPhysicalMaterial({ color: 0x1f3ce6, roughness: 0.2, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.06 });

        const font = await new FontLoader().loadAsync("compositions/assets/fonts/Geist800.typeface.json");
        const SIZE = 1.25;
        const scale = SIZE / font.data.resolution;
        const mono = new THREE.Group();
        let cursor = 0;
        const parts = [];
        for (const [ch, mat] of [["S", ceramic], ["J", cobalt]]) {
          const g = new TextGeometry(ch, { font, size: SIZE, depth: SIZE * 0.42, curveSegments: 14,
            bevelEnabled: true, bevelThickness: SIZE * 0.06, bevelSize: SIZE * 0.035, bevelSegments: 6 });
          g.computeBoundingBox();
          const b = g.boundingBox;
          g.translate(-b.min.x, 0, -SIZE * 0.21);
          const m = new THREE.Mesh(g, mat);
          m.position.x = cursor;
          mono.add(m);
          parts.push(m);
          cursor += (b.max.x - b.min.x) + SIZE * 0.06;
        }
        mono.children.forEach((m) => { m.position.x -= cursor / 2; });
        scene.add(mono);

        const clamp01 = (x) => Math.min(1, Math.max(0, x));
        const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp01(x)));
        const inOut = (x) => { const u = clamp01(x); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };

        host.render = (t) => {
          const rise = outExpo(t / 1.3);
          mono.position.y = 1.62 - 0.9 * (1 - rise);
          mono.scale.setScalar(0.86 + 0.14 * rise);
          mono.rotation.y = -0.75 + 0.85 * inOut(t / 3);
          mono.rotation.x = 0.06;
          parts[1].position.y = 0.06 * Math.sin(t * 2.0);
          renderer.render(scene, camera);
        };
        host.render(host.clock.t);
        host.ready();
      </script>
    </template>
  </body>
</html>
