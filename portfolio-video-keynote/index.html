<!doctype html>
<!--
  "Keynote" — Soham Jadhav, 30 s portfolio film (1920×1080, 60 fps).
  Track 0: the shared paper stage. Track 1: nine chapters, cut on the 120 BPM grid.
  Track 2: chapter progress rail. Tracks 3–4: synthesized score + SFX (scripts/synth_audio.py).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
    </script>
    <script src="vendor/gsap.min.js"></script>
    <script src="lib/kit.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f6f6f3; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f6f6f3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-fps="60" data-width="1920" data-height="1080">
      <div id="stage" data-composition-id="stage" data-composition-src="compositions/frames/00-stage.html"
        data-start="0" data-duration="30" data-track-index="0" data-width="1920" data-height="1080"></div>

      <div id="f01-intro" data-composition-id="f01-intro" data-composition-src="compositions/frames/01-intro.html"
        data-start="0" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="f02-gsoc" data-composition-id="f02-gsoc" data-composition-src="compositions/frames/02-gsoc.html"
        data-start="3" data-duration="2.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="f03-a3" data-composition-id="f03-a3" data-composition-src="compositions/frames/03-a3.html"
        data-start="5.5" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="f04-speed" data-composition-id="f04-speed" data-composition-src="compositions/frames/04-speed.html"
        data-start="9.5" data-duration="2.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="f05-papers" data-composition-id="f05-papers" data-composition-src="compositions/frames/05-papers.html"
        data-start="12" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="f06-products" data-composition-id="f06-products" data-composition-src="compositions/frames/06-products.html"
        data-start="15" data-duration="4.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="f07-community" data-composition-id="f07-community" data-composition-src="compositions/frames/07-community.html"
        data-start="19.5" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="f08-foundation" data-composition-id="f08-foundation" data-composition-src="compositions/frames/08-foundation.html"
        data-start="22.5" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="f09-finale" data-composition-id="f09-finale" data-composition-src="compositions/frames/09-finale.html"
        data-start="25.5" data-duration="4.5" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="rail" data-composition-id="rail" data-composition-src="compositions/frames/99-rail.html"
        data-start="0" data-duration="30" data-track-index="2" data-width="1920" data-height="1080"></div>

      <audio id="score" src="assets/audio/score.wav" data-start="0" data-duration="30" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="30" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
